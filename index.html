<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>매매수첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#12161d;
    --surface:#1a2029;
    --surface-raised:#212936;
    --border:#2b3441;
    --border-soft:#232b37;
    --text:#e8eaee;
    --text-muted:#8b93a3;
    --text-faint:#5c6472;
    --accent:#3fa796;
    --accent-soft:rgba(63,167,150,0.14);
    --amber:#e8a93e;
    --amber-soft:rgba(232,169,62,0.14);
    --gain:#52c17e;
    --gain-soft:rgba(82,193,126,0.12);
    --loss:#e2646b;
    --loss-soft:rgba(226,100,107,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .serif{font-family:'Gowun Batang',serif;}

  #app{ display:flex; min-height:100vh; }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:300px; min-width:260px;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    padding:22px 16px;
  }
  .brand{ padding:0 4px 18px 4px; border-bottom:1px solid var(--border-soft); margin-bottom:16px; }
  .brand h1{ font-family:'Gowun Batang',serif; font-size:23px; font-weight:700; margin:0 0 4px 0; letter-spacing:0.5px; }
  .brand p{ margin:0; font-size:12px; color:var(--text-muted); line-height:1.5; }
  .sidebar-scroll{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:2px; }
  .sidebar-group-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-faint);
    margin:12px 4px 2px 4px; font-weight:600;
  }
  .sidebar-group-label:first-child{ margin-top:0; }
  .sidebar-group-label.collapsible{ cursor:pointer; display:flex; align-items:center; justify-content:space-between; padding:2px 4px; }
  .sidebar-group-label.collapsible:hover{ color:var(--text-muted); }
  .sidebar-group-label .chev{ font-size:9px; }
  .fx-note{ font-size:10.5px; color:var(--text-faint); margin-left:8px; white-space:nowrap; }
  .fx-manual{ cursor:pointer; text-decoration:underline; color:var(--amber); }
  .account-pills{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .account-pill{
    background:var(--surface-raised); border:1px solid var(--border); color:var(--text-muted);
    border-radius:20px; padding:6px 13px; cursor:pointer; font-size:12.5px; font-weight:600;
    font-family:'Noto Sans KR',sans-serif;
  }
  .account-pill:hover{ color:var(--text); }
  .account-pill.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .pill-edit{ opacity:0.7; margin-left:2px; }
  .pill-edit:hover{ opacity:1; }
  .account-pill-add{
    background:transparent; border:1px dashed var(--border); color:var(--text-faint);
    border-radius:20px; width:30px; height:30px; cursor:pointer; font-size:14px; font-weight:600;
    font-family:'Noto Sans KR',sans-serif;
  }
  .account-pill-add:hover{ color:var(--accent); border-color:var(--accent); }
  .account-delete-link{
    display:block; background:none; border:none; color:var(--text-faint); font-size:11px;
    cursor:pointer; margin:2px 0 10px 2px; text-decoration:underline; font-family:'Noto Sans KR',sans-serif;
  }
  .account-delete-link:hover{ color:var(--loss); }
  .account-summary{
    background:var(--surface-raised); border:1px solid var(--border-soft); border-radius:5px;
    padding:10px 12px; margin-bottom:14px;
  }
  .account-summary-group-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-faint); margin:8px 0 2px 0; font-weight:600; }
  .account-summary-group-label:first-child{ margin-top:0; }
  .account-summary-row{ display:flex; justify-content:space-between; font-size:12px; padding:2px 0; }
  .account-summary-row span{ color:var(--text-muted); }
  .account-summary-row b{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .account-summary-row b.gain{ color:var(--gain); }
  .account-summary-row b.loss{ color:var(--loss); }
  .currency-toggle{ display:flex; gap:6px; margin:-10px 0 20px 0; }
  .ct-btn{
    background:var(--surface); border:1px solid var(--border-soft); color:var(--text-muted);
    border-radius:20px; padding:5px 12px; cursor:pointer; font-size:11.5px; font-weight:600;
    font-family:'Noto Sans KR',sans-serif;
  }
  .ct-btn.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .snapshot-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 18px 0; }
  .snapshot-tab{
    background:var(--surface); border:1px solid var(--border-soft); color:var(--text-muted);
    border-radius:5px; padding:6px 10px; cursor:pointer; font-size:12px; font-weight:600;
    font-family:'Noto Sans KR',sans-serif; display:flex; align-items:center; gap:6px;
  }
  .snapshot-tab.active{ background:var(--amber-soft); border-color:var(--amber); color:var(--amber); }
  .snapshot-tab-close{ color:var(--text-faint); font-size:13px; line-height:1; }
  .snapshot-tab-close:hover{ color:var(--loss); }
  .ticker-item{
    position:relative; background:var(--surface-raised); border:1px solid var(--border-soft);
    border-radius:3px; padding:11px 12px 11px 14px; cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .ticker-item:hover{border-color:var(--border);}
  .ticker-item.active{ border-color:var(--accent); background:var(--accent-soft); }
  .ticker-item::before{
    content:''; position:absolute; left:0;top:8px;bottom:8px; width:3px; border-radius:2px;
    background:var(--text-faint);
  }
  .ticker-item.status-holding::before{background:var(--accent);}
  .ticker-item.status-closed::before{background:var(--text-faint);}
  .ticker-row1{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .ticker-name{ font-family:'Gowun Batang',serif; font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ticker-code{ font-size:11px; color:var(--text-muted); letter-spacing:0.5px; font-family:'IBM Plex Mono',monospace;}
  .ticker-row2{ display:flex; justify-content:space-between; align-items:center; margin-top:5px; }
  .ticker-sector{ font-size:11px; color:var(--text-faint); }
  .ticker-pnl{ font-size:11px; font-weight:600; }
  .ticker-pnl.gain{color:var(--gain);}
  .ticker-pnl.loss{color:var(--loss);}
  .ticker-pnl.neutral{color:var(--text-faint);}
  .dca-tag{
    display:inline-block; font-size:9.5px; font-weight:700; color:var(--amber);
    background:var(--amber-soft); border-radius:10px; padding:1px 6px; margin-left:6px;
  }

  .add-company-btn{
    margin-top:14px; width:100%; background:transparent; border:1px dashed var(--border);
    color:var(--text-muted); padding:10px; border-radius:3px; cursor:pointer; font-size:13px;
    font-family:'Noto Sans KR',sans-serif; transition:all .15s ease;
  }
  .add-company-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- main ---------- */
  .main{ flex:1; padding:32px 44px; overflow-y:auto; }
  .empty-state{ height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-muted); text-align:center; }
  .empty-state .stamp-icon{
    width:56px;height:56px; border:2px solid var(--text-faint); border-radius:6px;
    display:flex;align-items:center;justify-content:center; transform:rotate(-6deg); margin-bottom:18px;
    font-family:'Gowun Batang',serif; font-size:22px; color:var(--text-faint);
  }
  .empty-state h2{ font-family:'Gowun Batang',serif; color:var(--text); font-size:19px; margin:0 0 6px 0; }
  .empty-state p{font-size:13px;margin:0;}

  .detail-header{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding-bottom:20px; border-bottom:1px solid var(--border-soft); margin-bottom:22px; gap:20px;
  }
  .detail-title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .detail-title{font-family:'Gowun Batang',serif;font-size:28px;font-weight:700;}
  .detail-code{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--text-muted);}
  .detail-sector{
    display:inline-block; margin-top:8px; font-size:11px; color:var(--text-muted);
    border:1px solid var(--border); padding:2px 9px; border-radius:20px;
  }
  .delete-company-btn{ background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:12px; padding:4px 8px; }
  .delete-company-btn:hover{color:var(--loss);}

  .stats-row{display:flex;gap:14px;margin-bottom:26px;flex-wrap:wrap;}
  .stat-card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:4px; padding:14px 18px; min-width:130px; }
  .stat-label{font-size:11px;color:var(--text-muted);margin-bottom:6px;}
  .stat-value{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;}
  .stat-value.gain{color:var(--gain);}
  .stat-value.loss{color:var(--loss);}

  .stamp{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px;
    letter-spacing:1.5px; padding:6px 14px; border:2px solid currentColor; border-radius:3px;
    transform:rotate(-3deg); position:relative; mix-blend-mode:screen;
  }
  .stamp::after{ content:''; position:absolute; inset:3px; border:1px solid currentColor; border-radius:2px; opacity:0.5; }
  .stamp.gain{color:var(--gain);}
  .stamp.loss{color:var(--loss);}

  .tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border-soft);}
  .tab-btn{
    background:none;border:none;color:var(--text-muted); font-family:'Noto Sans KR',sans-serif;
    font-size:14px; padding:10px 6px; margin-right:22px; cursor:pointer;
    border-bottom:2px solid transparent; transition:all .15s ease;
  }
  .tab-btn.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600;}
  .tab-btn:hover{color:var(--text);}

  .analysis-grid{display:flex;flex-direction:column;gap:16px;}
  .field-block label{ display:block;font-size:12px;color:var(--accent);margin-bottom:6px; font-weight:600;letter-spacing:0.3px; }
  .field-block textarea{
    width:100%; background:var(--surface); border:1px solid var(--border-soft); border-radius:4px;
    color:var(--text); font-family:'Noto Sans KR',sans-serif; font-size:13.5px; line-height:1.6;
    padding:11px 13px; resize:vertical; min-height:64px;
  }
  .field-block textarea:focus{outline:none;border-color:var(--accent);}
  .field-block.memo textarea{min-height:100px;}
  .save-indicator{ font-size:11px;color:var(--gain);opacity:0;transition:opacity .3s ease;margin-left:8px; }
  .save-indicator.show{opacity:1;}

  .add-trade-form{ background:var(--surface); border:1px solid var(--border-soft); border-radius:5px; padding:16px 18px; margin-bottom:22px; }
  .type-toggle{display:flex;gap:8px;margin-bottom:12px;}
  .type-btn{
    flex:1; padding:8px; border-radius:3px; border:1px solid var(--border); background:var(--surface-raised);
    color:var(--text-muted); cursor:pointer; font-size:13px; font-weight:600; font-family:'Noto Sans KR',sans-serif;
  }
  .type-btn.buy-active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .type-btn.sell-active{background:var(--loss-soft);border-color:var(--loss);color:var(--loss);}
  .type-btn.amber-active{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);}
  .form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .form-row .fgroup{flex:1;min-width:110px;}
  .form-row label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:4px;}
  .form-row input, .form-row select, .add-trade-form textarea{
    width:100%; background:var(--surface-raised); border:1px solid var(--border); border-radius:3px;
    color:var(--text); padding:8px 10px; font-size:13px; font-family:'IBM Plex Mono',monospace;
  }
  .add-trade-form textarea{font-family:'Noto Sans KR',sans-serif;min-height:56px;margin-bottom:12px;}
  .submit-trade-btn{
    background:var(--accent); color:#0d1712; border:none; padding:9px 20px; border-radius:3px;
    font-weight:700; font-size:13px; cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  }
  .submit-trade-btn:hover{opacity:0.88;}
  .submit-trade-btn.amber{background:var(--amber);}

  .trade-list{display:flex;flex-direction:column;gap:10px;}
  .trade-row{
    background:var(--surface); border:1px solid var(--border-soft); border-left:3px solid var(--text-faint);
    border-radius:3px; padding:12px 16px;
  }
  .trade-row.buy{border-left-color:var(--accent);}
  .trade-row.sell{border-left-color:var(--loss);}
  .trade-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .trade-left{display:flex;align-items:center;gap:10px;}
  .trade-badge{ font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px; }
  .trade-badge.buy{background:var(--accent-soft);color:var(--accent);}
  .trade-badge.sell{background:var(--loss-soft);color:var(--loss);}
  .trade-date{font-size:12px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;}
  .trade-nums{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text);display:flex;gap:14px;}
  .trade-nums span{color:var(--text-muted);font-size:11px;margin-right:3px;}
  .trade-pnl{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;}
  .trade-reason{ margin-top:9px;font-size:12.5px;color:var(--text-muted);line-height:1.55; border-top:1px solid var(--border-soft);padding-top:8px; }
  .trade-del{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:12px;}
  .trade-del:hover{color:var(--loss);}
  .no-trades{color:var(--text-faint);font-size:13px;padding:20px 0;text-align:center;}

  .new-company-panel{
    background:var(--surface); border:1px solid var(--border); border-radius:5px; padding:14px; margin-top:10px;
    display:flex;flex-direction:column;gap:8px;
  }
  .new-company-panel input, .new-company-panel select{
    background:var(--surface-raised); border:1px solid var(--border); border-radius:3px; color:var(--text);
    padding:8px 10px; font-size:13px; font-family:'Noto Sans KR',sans-serif;
  }
  .new-company-panel .actions{display:flex;gap:8px;margin-top:2px;}
  .new-company-panel button{ flex:1;padding:8px;border-radius:3px;border:none;cursor:pointer;font-size:12.5px;font-weight:600; font-family:'Noto Sans KR',sans-serif; }
  .btn-confirm{background:var(--accent);color:#0d1712;}
  .btn-cancel{background:var(--surface-raised);color:var(--text-muted);border:1px solid var(--border) !important;}

  .storage-note{ font-size:10.5px;color:var(--text-faint);padding:10px 4px 0 4px;line-height:1.5; }

  /* DCA plan tab */
  .dca-card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:6px;
    padding:18px 20px; margin-bottom:20px;
  }
  .dca-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .dca-badge{
    font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px;
    background:var(--amber-soft); color:var(--amber);
  }
  .dca-badge.paused{background:var(--surface-raised);color:var(--text-faint);}
  .dca-summary{ display:flex; gap:26px; margin-top:14px; flex-wrap:wrap; }
  .dca-summary .item .label{font-size:11px;color:var(--text-muted);margin-bottom:4px;}
  .dca-summary .item .value{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;}
  .dca-next{
    margin-top:14px; padding-top:14px; border-top:1px solid var(--border-soft);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
  }
  .dca-next .due-label{font-size:12px;color:var(--text-muted);}
  .dca-next .due-date{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:700;}
  .due-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;}
  .due-badge.waiting{background:var(--surface-raised);color:var(--text-faint);}
  .due-badge.ready{background:var(--gain-soft);color:var(--gain);}
  .dca-actions{display:flex;gap:8px;}
  .dca-actions button{
    background:var(--surface-raised); border:1px solid var(--border); color:var(--text-muted);
    padding:6px 12px; border-radius:3px; font-size:12px; cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  }
  .dca-actions button:hover{color:var(--text);}
  .dca-actions button.danger:hover{color:var(--loss);border-color:var(--loss);}
  .dca-hint{ font-size:11.5px; color:var(--text-faint); margin-top:12px; line-height:1.6; }
  .dca-history-title{font-size:12px;color:var(--text-muted);margin:22px 0 10px 0;font-weight:600;}

  /* portfolio overview (전체 자산 현황 · 분포) */
  .donut-wrap{ display:flex; gap:36px; align-items:center; flex-wrap:wrap; }
  .donut-chart{ width:210px; height:210px; min-width:210px; border-radius:50%; position:relative; }
  .donut-hole{
    position:absolute; inset:32px; background:var(--surface); border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:4px;
  }
  .donut-hole-label{ font-size:11px; color:var(--text-muted); }
  .donut-hole-value{ font-size:15px; font-weight:700; }
  .donut-legend{ flex:1; min-width:240px; display:flex; flex-direction:column; gap:9px; }
  .donut-legend-row{ display:flex; align-items:center; gap:10px; font-size:13px; }
  .donut-swatch{ width:11px; height:11px; border-radius:3px; flex-shrink:0; }
  .donut-legend-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .donut-legend-ticker{ color:var(--text-muted); font-size:11px; }
  .donut-legend-pct{ width:48px; text-align:right; color:var(--text-muted); }
  .donut-legend-value{ width:110px; text-align:right; }

  /* import modal */
  .import-btn{
    margin-top:8px; width:100%; background:transparent; border:1px dashed var(--border);
    color:var(--text-muted); padding:10px; border-radius:3px; cursor:pointer; font-size:13px;
    font-family:'Noto Sans KR',sans-serif; transition:all .15s ease;
  }
  .import-btn:hover{border-color:var(--amber);color:var(--amber);}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,10,14,0.72); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto;
  }
  .modal-box{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    width:100%; max-width:920px; padding:26px 30px 30px 30px;
  }
  .modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .modal-header h2{ font-family:'Gowun Batang',serif; font-size:19px; margin:0; }
  .modal-close{ background:none; border:none; color:var(--text-faint); font-size:20px; cursor:pointer; line-height:1; }
  .modal-close:hover{color:var(--text);}
  .modal-sub{ font-size:12px; color:var(--text-muted); margin-bottom:16px; line-height:1.6; }
  .import-textarea{
    width:100%; min-height:160px; background:var(--surface-raised); border:1px solid var(--border);
    border-radius:4px; color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:12.5px;
    padding:12px; resize:vertical;
  }
  .import-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:14px; }
  .import-actions button{
    padding:9px 18px; border-radius:3px; border:none; cursor:pointer; font-size:13px; font-weight:600;
    font-family:'Noto Sans KR',sans-serif;
  }
  .import-btn-primary{background:var(--amber);color:#241a06;}
  .import-btn-secondary{background:var(--surface-raised);color:var(--text-muted);border:1px solid var(--border) !important;}
  .mapping-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .mapping-group{ min-width:110px; }
  .mapping-group label{ display:block; font-size:10.5px; color:var(--text-muted); margin-bottom:4px; }
  .mapping-group select{
    width:100%; background:var(--surface-raised); border:1px solid var(--border); border-radius:3px;
    color:var(--text); padding:6px 8px; font-size:12px; font-family:'Noto Sans KR',sans-serif;
  }
  .preview-wrap{ max-height:320px; overflow:auto; border:1px solid var(--border-soft); border-radius:4px; }

<body>
<div id="app"></div>

<script>
(function(){
  let companies = [];
  let trades = [];
  let accounts = [];
  let activeAccountId = null;
  let showNewAccountForm = false;
  let fxRates = {}; // cache: "USD|2025-07-01" -> number, or "USD|latest" -> {rate, onDate}
  const fxFetchInFlight = new Set();
  const currentPriceFetching = new Set();
  let companyViewCurrency = 'native'; // 'native' | 'KRW' — toggle for the selected company's figures
  let showClosedGroup = false; // sidebar: closed/sold-out positions collapsed by default
  let sidebarPage = {holding:0, closed:0, notrade:0}; // sidebar: current page per group when paginated
  let sidebarExpanded = {holding:false, closed:false, notrade:false}; // sidebar: "전체 보기"로 페이지 나누기를 끈 그룹
  let tradeListPage = 0; // 매매 기록 탭: 현재 페이지
  let tradeListExpanded = false; // 매매 기록 탭: "전체 보기"
  let showFxBulkModal = false;
  let fxBulkCurrency = 'USD';
  let fxBulkSummary = null;
  let fxBulkAnalyzing = false;
  let fxBulkError = null;
  let showPriceBulkModal = false;
  let priceBulkSummary = null;
  let priceBulkMode = 'paste'; // 'paste' | 'image'
  let priceBulkImageFile = null;
  let priceBulkAnalyzing = false;
  let showBackupModal = false;
  let backupTab = 'export'; // 'export' | 'import'
  let backupImportSummary = null;
  let selectedId = null;
  let activeTab = 'trades';
  let showPortfolioOverview = false;
  let portfolioScope = 'all'; // 'all' | accountId — 자산 분포 보기 범위
  let portfolioBreakdown = 'ticker'; // 'ticker' 또는 분류 기준(scheme)의 id — 자산 분포를 어느 기준으로 볼지
  let portfolioCurrency = 'KRW'; // 'KRW' | 'USD' — 전체 자산 현황 화면의 표시 통화
  let expandedDistBucketKey = null; // 자산 분포 범례에서 지금 펼쳐서 구성 비율을 보고 있는 항목의 key
  let portfolioSnapshots = []; // [{id, savedAt, scope, scopeLabel, fxRateUSD, summary, breakdowns:[{id,label,dist}]}] — 저장해 둔 시점의 전체 자산 현황
  let viewingSnapshotId = null; // null이면 지금 이 순간(현재) 보기, 아니면 그 저장 시점을 보고 있음
  let activeUsdRateOverride = undefined; // 저장 시점 스냅샷을 보는 동안 원/달러 변환에 쓸 고정 환율(저장 당시 환율) — undefined면 실시간 환율 사용
  let showClosedOverview = false; // 전체 자산 현황 화면: 청산 완료 섹션 기본 접힘
  let showClosedAcctSummary = false; // 사이드바 계좌 요약 박스: 청산 완료 섹션 기본 접힘
  let acctSummaryCurrency = 'KRW'; // 사이드바 계좌 요약 박스: 원화/달러 토글
  let groupSchemes = []; // [{id, name}] — "자산 종류별 분류", "거래소별 분류" 같은 여러 분류 기준
  let groups = []; // [{id, schemeId, name, isCash}] — 각 분류 기준에 속한 그룹들
  let showGroupsModal = false;
  let groupsModalSchemeId = null; // 그룹 관리 모달에서 지금 펼쳐서 보고 있는 분류 기준
  let cashModalAccountId = null; // null이면 닫힘, 아니면 그 계좌의 현금 입력 모달이 열림
  let showTransferModal = false; // 선택된 종목을 다른 계좌로 이동하는 모달
  let transferTargetAccountId = null; // 계좌 이동 모달에서 선택된 대상 계좌 (null이면 첫번째 다른 계좌)
  let editCompanyId = null; // null이면 닫힘, 아니면 그 종목의 종목명/티커 수정 모달이 열림
  let showNewCompanyForm = false;
  let tradeType = 'buy';
  let dataReady = false;

  // transient form state for DCA plan creation
  let newDcaFreq = 'monthly';
  let newDcaMode = 'amount';

  // CSV import state
  let showImportModal = false;
  let importMode = 'csv'; // 'csv' | 'image'
  let importStep = 'paste'; // 'paste' | 'preview'
  let importRawTable = []; // full parsed table incl. header row
  let importHeaders = [];
  let importColMap = {date:-1, name:-1, ticker:-1, side:-1, price:-1, qty:-1};
  let importRows = []; // {date,name,ticker,side,price,qty,currency,excluded}
  let importSummary = null;
  let importBatchCurrency = 'KRW';
  let importPasteYear = new Date().getFullYear();
  let lastImportBatch = null; // {tradeIds, companyIds, count, ts}
  let importImageYear = new Date().getFullYear();
  let importImageFile = null; // {base64, mediaType, previewUrl}
  let importAnalyzing = false;
  let importError = null;
  let importExcelFile = null; // {base64, name}
  let importParsedAsLedger = false;
  let importLedgerOtherCount = 0;
  let importAccountId = null;
  let importPdfFile = null; // {base64, name}
  let importPdfPassword = '';

  const IMPORT_KEYWORDS = {
    date: ['거래일자','체결일자','거래일','체결일','날짜','일자','date','trade date'],
    name: ['종목명','종목','name','상품명','종목이름'],
    ticker: ['종목코드','티커','코드','symbol','ticker'],
    side: ['거래구분','매매구분','구분','side','type','매수매도','거래명','거래종류'],
    price: ['체결가','단가','가격','price','체결단가','거래단가'],
    qty: ['체결수량','수량','거래수량','qty','quantity']
  };

  const TEMPLATE_FIELDS = [
    {key:'business', label:'사업 개요'},
    {key:'financials', label:'재무 요약'},
    {key:'industry', label:'산업 및 경쟁 구도'},
    {key:'risk', label:'투자 리스크'},
    {key:'valuation', label:'밸류에이션'},
  ];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }

  // ---------- local storage shim (was window.storage — Claude 아티팩트 전용 API) ----------
  const LS_PREFIX = 'mmsc_';
  const storage = {
    async get(key){
      try{
        const raw = localStorage.getItem(LS_PREFIX+key);
        return raw===null ? null : {value: raw};
      }catch(e){ return null; }
    },
    async set(key, value){
      try{ localStorage.setItem(LS_PREFIX+key, value); }
      catch(e){ console.error('저장 실패', e); }
    },
    async delete(key){
      try{ localStorage.removeItem(LS_PREFIX+key); }
      catch(e){ /* ignore */ }
    }
  };

  // ---------- Anthropic API key (사용자가 직접 입력, 이 브라우저에만 저장) ----------
  let anthropicApiKey = '';
  try{ anthropicApiKey = localStorage.getItem(LS_PREFIX+'anthropic_api_key') || ''; }catch(e){}
  let showApiKeyModal = false;
  const ANTHROPIC_MODEL = 'claude-sonnet-5';

  function saveApiKey(key){
    anthropicApiKey = (key||'').trim();
    try{
      if(anthropicApiKey) localStorage.setItem(LS_PREFIX+'anthropic_api_key', anthropicApiKey);
      else localStorage.removeItem(LS_PREFIX+'anthropic_api_key');
    }catch(e){ /* ignore */ }
  }

  function anthropicHeaders(){
    return {
      'Content-Type':'application/json',
      'x-api-key': anthropicApiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    };
  }

  // AI 기능(현재가 조회·스크린샷 분석)을 쓰기 전에 호출. 키가 없으면 설정 모달을 띄우고 false를 반환.
  function ensureApiKey(){
    if(anthropicApiKey) return true;
    showApiKeyModal = true;
    render();
    return false;
  }

  async function loadData(){
    try{
      const c = await storage.get('companies');
      companies = c ? JSON.parse(c.value) : [];
    }catch(e){ companies = []; }
    try{
      const t = await storage.get('trades');
      trades = t ? JSON.parse(t.value) : [];
    }catch(e){ trades = []; }
    try{
      const a = await storage.get('accounts');
      accounts = a ? JSON.parse(a.value) : [];
    }catch(e){ accounts = []; }
    try{
      const fx = await storage.get('fxrates');
      fxRates = fx ? JSON.parse(fx.value) : {};
    }catch(e){ fxRates = {}; }
    try{
      const lb = await storage.get('lastimportbatch');
      lastImportBatch = lb ? JSON.parse(lb.value) : null;
    }catch(e){ lastImportBatch = null; }
    try{
      const gs = await storage.get('groupschemes');
      groupSchemes = gs ? JSON.parse(gs.value) : [];
    }catch(e){ groupSchemes = []; }
    try{
      const g = await storage.get('groups');
      groups = g ? JSON.parse(g.value) : [];
    }catch(e){ groups = []; }
    try{
      const ps = await storage.get('portfoliosnapshots');
      portfolioSnapshots = ps ? JSON.parse(ps.value) : [];
    }catch(e){ portfolioSnapshots = []; }

    let needsSave = false;
    if(!accounts.length){
      accounts.push({id:uid(), name:'기본 계좌', createdAt:Date.now()});
      needsSave = true;
    }
    const defaultAccountId = accounts[0].id;
    companies.forEach(c=>{
      if(!c.accountId){ c.accountId = defaultAccountId; needsSave = true; }
    });
    accounts.forEach(a=>{
      if(!a.cash){ a.cash = {USD:0, JPY:0, KRW:0}; needsSave = true; }
    });
    // 이전 버전 호환: 그룹에 분류 기준(schemeId)이 없던 구버전 데이터를 "그룹" 이름의 기본 분류 기준으로 이전
    if(groups.length && groups.some(g=>!g.schemeId)){
      const legacySchemeId = uid();
      groupSchemes.push({id: legacySchemeId, name:'그룹'});
      groups.forEach(g=>{ if(!g.schemeId) g.schemeId = legacySchemeId; });
      companies.forEach(c=>{
        if(c.groupId){
          c.groupAssignments = c.groupAssignments || {};
          c.groupAssignments[legacySchemeId] = c.groupId;
          delete c.groupId;
        }
      });
      await saveGroupSchemes();
      await saveGroups();
      needsSave = true;
    }
    // 이전 버전 호환: 분류 기준이 계좌 구분 없이 전체 공용이던 구버전 데이터를 첫 번째 계좌 소속으로 이전
    if(groupSchemes.some(s=>!s.accountId)){
      const defaultAccountId2 = accounts[0].id;
      groupSchemes.forEach(s=>{ if(!s.accountId) s.accountId = defaultAccountId2; });
      await saveGroupSchemes();
      needsSave = true;
    }
    // 이전 버전 호환: "수익률 계산에서 제외" 토글이 "현금으로 표시"로 통합됨
    companies.forEach(c=>{
      if(c.excludeFromReturn !== undefined){
        if(c.excludeFromReturn && !c.isCash) c.isCash = true;
        delete c.excludeFromReturn;
        needsSave = true;
      }
    });
    if(needsSave){ await saveAccounts(); await saveCompanies(); }
    // 이전 버전 호환: 스냅샷이 계좌 하나(scope)만 저장하던 구버전 구조 -> 여러 범위를 담는 byScope 구조로 이전
    if(portfolioSnapshots.some(s=>!s.byScope)){
      portfolioSnapshots.forEach(s=>{
        if(!s.byScope){
          s.byScope = {[s.scope]: {scopeLabel: s.scopeLabel, summary: s.summary, breakdowns: s.breakdowns}};
          delete s.scope; delete s.scopeLabel; delete s.summary; delete s.breakdowns;
        }
      });
      await savePortfolioSnapshots();
    }

    dataReady = true;
    activeAccountId = accounts[0].id;
    const firstInAccount = companies.find(c=>c.accountId===activeAccountId);
    if(firstInAccount) selectedId = firstInAccount.id;
    render();
  }

  async function saveAccounts(){
    try{ await storage.set('accounts', JSON.stringify(accounts)); }
    catch(e){ console.error('저장 실패', e); }
  }

  async function saveCompanies(){
    try{ await storage.set('companies', JSON.stringify(companies)); }
    catch(e){ console.error('저장 실패', e); }
  }
  async function saveTrades(){
    try{ await storage.set('trades', JSON.stringify(trades)); }
    catch(e){ console.error('저장 실패', e); }
  }
  async function saveFxRates(){
    try{ await storage.set('fxrates', JSON.stringify(fxRates)); }
    catch(e){ console.error('저장 실패', e); }
  }
  async function saveGroups(){
    try{ await storage.set('groups', JSON.stringify(groups)); }
    catch(e){ console.error('저장 실패', e); }
  }
  async function saveGroupSchemes(){
    try{ await storage.set('groupschemes', JSON.stringify(groupSchemes)); }
    catch(e){ console.error('저장 실패', e); }
  }
  async function savePortfolioSnapshots(){
    try{ await storage.set('portfoliosnapshots', JSON.stringify(portfolioSnapshots)); }
    catch(e){ console.error('저장 실패', e); }
  }
  async function saveLastImportBatch(){
    try{
      if(lastImportBatch) await storage.set('lastimportbatch', JSON.stringify(lastImportBatch));
      else await storage.delete('lastimportbatch');
    }catch(e){ /* ignore */ }
  }

  // ---------- full backup / restore ----------
  function buildBackupJson(){
    return JSON.stringify({
      version: 1,
      exportedAt: new Date().toISOString(),
      accounts, companies, trades, fxRates
    }, null, 2);
  }

  function downloadBackupFile(){
    try{
      const json = buildBackupJson();
      const blob = new Blob([json], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '매매수첩_백업_'+todayStr()+'.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      return true;
    }catch(e){
      console.error(e);
      return false;
    }
  }

  async function restoreFromBackup(jsonText){
    let parsed;
    try{ parsed = JSON.parse(jsonText); }
    catch(e){ return {ok:false, error:'JSON 형식을 읽지 못했어요. 백업 파일 내용이 맞는지 확인해주세요.'}; }
    if(!parsed || !Array.isArray(parsed.companies) || !Array.isArray(parsed.trades)){
      return {ok:false, error:'백업 파일 형식이 예상과 달라요.'};
    }
    accounts = Array.isArray(parsed.accounts) && parsed.accounts.length ? parsed.accounts : accounts;
    companies = parsed.companies;
    trades = parsed.trades;
    fxRates = parsed.fxRates || {};
    if(!accounts.length){ accounts = [{id:uid(), name:'기본 계좌', createdAt:Date.now()}]; }
    activeAccountId = accounts[0].id;
    const firstInAccount = companies.find(c=>c.accountId===activeAccountId);
    selectedId = firstInAccount ? firstInAccount.id : null;
    await saveAccounts();
    await saveCompanies();
    await saveTrades();
    await saveFxRates();
    return {ok:true, companies: companies.length, trades: trades.length, accounts: accounts.length};
  }

  function fmtUSD(n){
    if(n===null||n===undefined||isNaN(n)) return '-';
    const sign = n<0 ? '-' : '';
    return sign + '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function fmtMoney(n, currency){
    currency = currency || 'USD';
    if(n===null||n===undefined||isNaN(n)) return '-';
    if(currency==='KRW'){
      const sign = n<0 ? '-' : '';
      return sign + '₩' + Math.round(Math.abs(n)).toLocaleString('ko-KR');
    }
    if(currency==='JPY'){
      const sign = n<0 ? '-' : '';
      return sign + '¥' + Math.round(Math.abs(n)).toLocaleString('ja-JP');
    }
    return fmtUSD(n);
  }
  function currencySymbol(currency){
    if(currency==='KRW') return '₩';
    if(currency==='JPY') return '¥';
    return '$';
  }

  // ---------- FX rate lookup (KRW equivalent for USD/JPY amounts) ----------
  function fxKey(currency, date){ return currency+'|'+date; }

  async function ensureFxRate(currency, date){
    if(currency==='KRW') return;
    const key = fxKey(currency, date);
    if(fxFetchInFlight.has(key)) return;
    fxFetchInFlight.add(key);
    let result = null;
    try{
      const url = date==='latest'
        ? ('https://api.frankfurter.app/latest?from='+currency+'&to=KRW')
        : ('https://api.frankfurter.app/'+date+'?from='+currency+'&to=KRW');
      const res = await fetch(url);
      if(res.ok){
        const data = await res.json();
        const rate = data && data.rates && data.rates.KRW;
        if(rate) result = rate;
      }
    }catch(e){ /* network blocked or API unreachable — leave as failed */ }

    if(date==='latest'){
      // 실패해도 오늘 날짜와 함께 저장해야 "오늘은 이미 시도해봤다"를 구분할 수 있고,
      // 날짜가 바뀌면(cached.onDate!==todayStr()) 자동으로 재시도된다. 실패를 그냥 null로만
      // 저장하면 날짜 비교를 못 해서 한 번 실패한 뒤로 영영 재시도가 안 되는 문제가 있었다.
      fxRates[key] = {rate: result, onDate: todayStr()};
    } else if(result===null){
      // 과거 날짜도 마찬가지 — 실패를 그냥 null로 저장하면 (네트워크 문제로 실패한 것이든
      // 아직 데이터가 없는 것이든) 영영 재시도가 안 된다. 날짜를 같이 저장해서 하루 지나면
      // 다시 시도해보게 한다. 성공한 값은 기존처럼 순수 숫자로 저장(getMostRecentFxDate 호환).
      fxRates[key] = {rate: null, onDate: todayStr()};
    } else {
      fxRates[key] = result;
    }
    await saveFxRates();
    fxFetchInFlight.delete(key);
    render();
  }

  // Returns: number (rate), null (lookup failed — offer manual entry), or undefined (still loading)
  function getFxRateIfReady(currency, date){
    if(currency==='KRW') return 1;
    const key = fxKey(currency, date);
    const cached = fxRates[key];
    if(cached === undefined){
      ensureFxRate(currency, date);
      return undefined;
    }
    if(date==='latest'){
      if(cached === null) return null;
      if(cached.onDate !== todayStr()){ ensureFxRate(currency, date); return undefined; }
      return cached.rate;
    }
    if(typeof cached === 'number') return cached; // 성공해서 저장된 값
    // 실패 기록(신규 형식 {rate:null,onDate} 또는 예전 버전이 남긴 순수 null) — 날짜가
    // 바뀌었으면 다시 시도, 오늘 이미 시도해봤으면 실패로 확정해 수동 입력을 유도한다.
    const failedOnDate = (cached && typeof cached==='object') ? cached.onDate : null;
    if(failedOnDate !== todayStr()){ ensureFxRate(currency, date); return undefined; }
    return null;
  }

  // Finds the most recent historical rate we have on file for a currency (from bulk-imported data, say).
  function getMostRecentFxDate(currency){
    const prefix = currency+'|';
    let best = null;
    Object.keys(fxRates).forEach(k=>{
      if(!k.startsWith(prefix)) return;
      const datePart = k.slice(prefix.length);
      if(datePart==='latest') return;
      if(typeof fxRates[k] !== 'number') return;
      if(!best || datePart > best.date){ best = {date: datePart, rate: fxRates[k]}; }
    });
    return best;
  }

  // "Latest" lookup with graceful fallback: if today's live rate isn't available (blocked network,
  // or simply not fetched yet), fall back to the most recent rate we do have on file rather than
  // blocking the whole UI on a live fetch that may never succeed.
  // Returns {rate, isFallback, asOfDate} on success, null if nothing at all is available, or
  // undefined while a live fetch is still in flight and no fallback data exists either.
  function getEffectiveLatestRate(currency){
    if(currency==='KRW') return {rate:1, isFallback:false, asOfDate: todayStr()};
    const key = fxKey(currency, 'latest');
    const cached = fxRates[key];
    // cached는 성공 시 {rate, onDate}, 실패해도 {rate:null, onDate}(오늘 이미 시도해봄을 기록).
    // 예전 버전에서 저장된 순수 null 값(구버전 실패 기록)은 onDate가 없어서 아래에서 바로 재시도된다.
    const triedToday = !!(cached && cached.onDate===todayStr());
    if(triedToday && cached.rate){
      return {rate: cached.rate, isFallback:false, asOfDate: cached.onDate};
    }
    if(!triedToday){
      ensureFxRate(currency, 'latest'); // fire-and-forget; UI falls back below in the meantime
    }
    const fallback = getMostRecentFxDate(currency);
    if(fallback) return {rate: fallback.rate, isFallback:true, asOfDate: fallback.date};
    if(triedToday && !cached.rate) return null;
    return undefined;
  }

  // Convert a native-currency amount into the target currency ('native' = no-op, 'KRW' = convert).
  // Returns {value} on success, {pending:true} while loading, or {failed:true} if lookup failed.
  function convertAmount(nativeAmount, currency, date, targetCurrency){
    if(targetCurrency==='native' || currency==='KRW') return {value: nativeAmount};
    // 오늘 날짜 거래는 "latest"와 동일하게 취급한다 — 프랑크푸르터 API가 당일 환율을
    // 아직 발표하지 않아 정확한 날짜로는 조회가 실패해도, latest 쪽은 어제 환율로
    // 안전하게 대체되고 날짜가 바뀌면 자동 재시도되는 로직을 그대로 재사용할 수 있다.
    if(date===todayStr()) date = 'latest';
    if(date==='latest'){
      const r = getEffectiveLatestRate(currency);
      if(r===undefined) return {pending:true};
      if(r===null) return {failed:true};
      return {value: nativeAmount*r.rate, isFallback:r.isFallback, asOfDate:r.asOfDate};
    }
    const rate = getFxRateIfReady(currency, date);
    if(rate === undefined) return {pending:true};
    if(rate === null) return {failed:true};
    return {value: nativeAmount * rate};
  }

  // 원화 환산에 실제로 어떤 환율/기준일이 적용됐는지 눈으로 바로 확인할 수 있게 붙이는 작은 표시.
  function fxRateTagHtml(rate, currency, asOfDate, isFallback){
    const perUnit = currency==='JPY' ? rate*100 : rate;
    const unitLabel = currency==='JPY' ? '100엔' : '1'+currency;
    const staleNote = isFallback ? ', 최신 아님' : '';
    const title = isFallback ? '오늘 환율을 못 가져와서 마지막으로 등록된 '+asOfDate+' 환율을 대신 썼어요' : '적용된 환율';
    return '<span class="fx-note" style="opacity:0.8;" title="'+title+'">(환율 '+unitLabel+'='+fmtMoney(perUnit,'KRW')+' · '+asOfDate+' 기준'+staleNote+')</span>';
  }

  // Renders a single monetary figure, converting + offering click-to-edit FX when needed.
  function viewAmountHtml(nativeAmount, currency, date, targetCurrency){
    if(currency==='KRW' || targetCurrency==='native'){
      return fmtMoney(nativeAmount, currency);
    }
    if(date===todayStr()) date = 'latest'; // convertAmount와 동일한 이유로 오늘 날짜는 latest로 통일
    if(date==='latest'){
      const r = getEffectiveLatestRate(currency);
      const attr = 'data-fxmanual="'+currency+'|latest"';
      if(r===undefined) return '<span class="fx-note">환율 조회 중…</span>';
      if(r===null) return '<span class="fx-note fx-manual" '+attr+' title="클릭해서 환율 입력">환율 조회 실패 · 직접 입력</span>';
      const tag = ' '+fxRateTagHtml(r.rate, currency, r.asOfDate, r.isFallback);
      return '<span class="fx-manual" '+attr+' title="클릭해서 환율 수정">'+fmtMoney(nativeAmount*r.rate, 'KRW')+' ✎</span>'+tag;
    }
    const rate = getFxRateIfReady(currency, date);
    const attr = 'data-fxmanual="'+currency+'|'+date+'"';
    if(rate === undefined) return '<span class="fx-note">환율 조회 중…</span>';
    if(rate === null) return '<span class="fx-note fx-manual" '+attr+' title="클릭해서 환율 입력">환율 조회 실패 · 직접 입력</span>';
    return '<span class="fx-manual" '+attr+' title="클릭해서 환율 수정">'+fmtMoney(nativeAmount*rate, 'KRW')+' ✎</span>';
  }

  async function analyzeFxFile(file){
    setFxFileStatus('"'+file.name+'" 분석 중…', false);
    try{
      const base64 = await fileToBase64(file);
      const bytes = base64ToBytes(base64);
      let allRows = [];

      const isZip = bytes[0]===0x50 && bytes[1]===0x4B;
      const isOle = bytes[0]===0xD0 && bytes[1]===0xCF && bytes[2]===0x11 && bytes[3]===0xE0;

      if(isZip || isOle){
        if(typeof XLSX === 'undefined'){ throw new Error('엑셀 처리 라이브러리를 불러오지 못했어요. 잠시 후 다시 시도해주세요.'); }
        const wb = XLSX.read(base64, {type:'base64'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        allRows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''})
          .map(r=>r.map(c=>(c===undefined||c===null)?'':c.toString()));
      } else {
        let peek = '';
        const peekLen = Math.min(bytes.length, 4000);
        for(let i=0;i<peekLen;i++){ peek += String.fromCharCode(bytes[i]); }
        let text;
        try{ text = decodeBytesSmart(bytes, peek); }
        catch(e){ text = new TextDecoder('utf-8').decode(bytes); }
        text = text.replace(/^\uFEFF/, ''); // strip BOM

        if(/<(?:\w+:)?Worksheet\b|<(?:\w+:)?Workbook\b/i.test(text)){
          allRows = parseSpreadsheetMLRows(text);
        } else if(/<table/i.test(text)){
          allRows = parseHtmlTableRows(text);
        } else if(text.trim().length){
          allRows = parseDelimited(text);
        } else {
          throw new Error('파일에서 데이터를 찾지 못했어요.');
        }
      }

      allRows = allRows.filter(r=>r.some(c=>(c||'').toString().trim()!==''));
      if(!allRows.length){ throw new Error('파일에서 데이터를 찾지 못했어요.'); }

      const DATE_KW = ['날짜','일자','date','거래일자'];
      const RATE_KW = ['종가','환율','rate','close','매매기준율','기준율'];
      let headerIdx=-1, dateIdx=-1, rateIdx=-1;
      for(let i=0;i<Math.min(allRows.length,5);i++){
        const row = allRows[i].map(c=>(c||'').toString().toLowerCase());
        const dIdx = row.findIndex(c=>DATE_KW.some(k=>c.includes(k.toLowerCase())));
        const rIdx = row.findIndex(c=>RATE_KW.some(k=>c.includes(k.toLowerCase())));
        if(dIdx!==-1 && rIdx!==-1){ headerIdx=i; dateIdx=dIdx; rateIdx=rIdx; break; }
      }
      if(headerIdx===-1){ headerIdx=0; dateIdx=0; rateIdx=1; } // fallback: assume date,rate columns

      const lines = [];
      let skipped = 0;
      for(let i=headerIdx+1; i<allRows.length; i++){
        const row = allRows[i];
        const date = normalizeDate(row[dateIdx]);
        const rate = normalizeNumber(row[rateIdx]);
        if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || !rate || parseFloat(rate)<=0){ skipped++; continue; }
        lines.push(date+','+rate);
      }
      if(!lines.length){ throw new Error('날짜/환율로 인식되는 행이 없었어요. 형식을 확인해주세요.'); }

      const textarea = document.getElementById('fxbulk-paste');
      if(textarea) textarea.value = lines.join('\n');
      setFxFileStatus('"'+file.name+'"에서 '+lines.length+'개 행을 읽었어요'+(skipped?(' ('+skipped+'개 제외)'):'')+'. 아래에서 확인하고 "저장" 버튼을 눌러주세요.', false);
    }catch(e){
      console.error(e);
      setFxFileStatus('파일을 읽는 데 실패했어요: ' + e.message, true);
    }
  }

  async function applyFxBulkData(currency, text){
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
    let saved = 0, skipped = 0;
    for(const line of lines){
      const delim = line.includes('\t') ? '\t' : ',';
      const idx = line.indexOf(delim);
      if(idx===-1){ skipped++; continue; }
      const rawDate = line.slice(0, idx).trim();
      const rawRate = line.slice(idx+delim.length).trim();
      const date = normalizeDate(rawDate);
      let rate = parseFloat(normalizeNumber(rawRate));
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || !rate || rate<=0){ skipped++; continue; }
      // JPY는 두 가지 표기가 섞여 들어올 수 있어요: 한국 은행/포털 표기인 "100엔당" (보통 600~1300대)와
      // investing.com 등 JPY/KRW 페어 원본인 "1엔당" (보통 6~15대). 값 크기로 표기 방식을 판별해서
      // "100엔당"일 때만 100으로 나눠 1엔당 기준으로 통일한다. (그대로 나누면 investing.com 데이터가
      // 100배 작게 저장되는 문제가 있었음)
      if(currency==='JPY' && rate>=50) rate = rate/100;
      fxRates[fxKey(currency, date)] = rate;
      saved++;
    }
    await saveFxRates();
    return {saved, skipped};
  }



  // ---------- current price + return metrics ----------
  async function fetchCurrentPrice(companyId){

        + '통화는 '+company.currency+' 기준으로 답변하고, 다른 설명 없이 반드시 아래 JSON 형식으로만 답변하세요: '
        + '{"price": 123.45, "asOf": "2026-07-04"}';

  // Bulk-apply current prices pasted as "ticker,price" or "name,price" lines, matched
  // against companies in the given account.
  async function applyPriceBulkData(accountId, text){
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
    let updated = 0, skipped = 0;
    const failedLines = [];
    for(const line of lines){
      const delim = line.includes('\t') ? '\t' : ',';
      const idx = line.indexOf(delim);
      if(idx===-1){ skipped++; failedLines.push(line); continue; }
      const key = line.slice(0, idx).trim();
      const rawPrice = line.slice(idx+delim.length).trim();
      const price = parseFloat(normalizeNumber(rawPrice));
      if(!key || !price || price<=0){ skipped++; failedLines.push(line); continue; }
      const normKey = key.toLowerCase().replace(/\s+/g,'');
      const company = companies.find(c=>
        c.accountId===accountId && (
          (c.ticker && c.ticker.toLowerCase().replace(/\s+/g,'')===normKey) ||
          (c.name && c.name.toLowerCase().replace(/\s+/g,'')===normKey)
        )
      );
      if(!company){ skipped++; failedLines.push(line); continue; }
      company.currentPrice = {value: price, asOf: todayStr(), fetchedAt: Date.now()};
      updated++;
    }
    await saveCompanies();
    return {updated, skipped, failedLines};
  }

  // Aggregate cost / proceeds / current value / total return% for one company, expressed in targetCurrency.
  function computeReturnMetrics(companyId, targetCurrency){
    const company = companies.find(c=>c.id===companyId);
    const st = computeStats(companyId);
    const list = trades.filter(t=>t.companyId===companyId);
    let totalBuyCost = 0, totalSellProceeds = 0, totalBuyQty = 0, pending = false, anyFailed = false;
    const cur = company ? (company.currency||'USD') : 'USD';
    if(st.status==='holding'){
      // 보유 중일 때는 "지금 들고 있는 몫"의 매입원가만 매입금액에 넣는다 — 예전에 일부를 팔았던 이력까지
      // 합치면(= 전체 매수 총합) 이미 청산한 몫의 원가까지 끼어들어서 평가손익/수익률이 왜곡된다.
      if(company && company.holdingAdjust){
        const conv = convertAmount(company.holdingAdjust.qty*company.holdingAdjust.avgPrice, cur, 'latest', targetCurrency);
        if(conv.pending) pending = true;
        else if(conv.failed) anyFailed = true;
        else totalBuyCost = conv.value;
      } else {
        st.lots.forEach(lot=>{
          const conv = convertAmount(lot.qty*lot.price, cur, lot.date, targetCurrency);
          if(conv.pending) pending = true;
          else if(conv.failed) anyFailed = true;
          else totalBuyCost += conv.value;
        });
      }
      totalBuyQty = st.holdingQty;
    } else {
      list.forEach(t=>{
        const tcur = t.currency || cur;
        const conv = convertAmount(t.price*t.qty, tcur, t.date, targetCurrency);
        if(conv.pending){ pending = true; return; }
        if(conv.failed){ anyFailed = true; return; }
        if(t.type==='buy'){ totalBuyCost += conv.value; totalBuyQty += t.qty; }
        else totalSellProceeds += conv.value;
      });
    }
    let currentValue = 0, hasCurrentPrice = !!(company && company.currentPrice);
    if(st.holdingQty>0 && hasCurrentPrice){
      const conv = convertAmount(company.currentPrice.value*st.holdingQty, company.currency, 'latest', targetCurrency);
      if(conv.pending) pending = true;
      else if(conv.failed) anyFailed = true;
      else currentValue = conv.value;
    }
    const totalReturnPct = totalBuyCost>0 ? ((totalSellProceeds+currentValue-totalBuyCost)/totalBuyCost*100) : null;
    const avgBuyPrice = totalBuyQty>0 ? (totalBuyCost/totalBuyQty) : null;
    return {totalBuyCost, totalSellProceeds, totalBuyQty, avgBuyPrice, currentValue, totalReturnPct, pending, anyFailed, holdingQty: st.holdingQty, hasCurrentPrice};
  }

  // 한 종목의 매매 내역을 FIFO로 매칭해서, "보유 중인 몫"과 "이미 청산한 몫"의 매입/평가·매도 금액을
  // 각 거래 당시 환율로 원화 환산해 분리한다. (같은 통화 변환 기준을 매입 시점 vs 평가 시점으로 나눠 써야
  // 환차손익이 손익 계산에 왜곡 없이 반영됨 — computeReturnMetrics의 방식과 동일한 기준)
  function computeCompanySplitKRW(company){
    const cur = company.currency || 'USD';
    const list = trades.filter(t=>t.companyId===company.id)
      .slice()
      .sort((a,b)=> a.date===b.date ? (a.createdAt-b.createdAt) : (a.date<b.date?-1:1));
    let lots = [];
    let closedBuyCost = 0, closedSellProceeds = 0, pending = false;
    for(const t of list){
      if(t.type==='buy'){
        lots.push({qty:t.qty, price:t.price, date:t.date});
      } else {
        let remaining = t.qty;
        while(remaining>0 && lots.length>0){
          const lot = lots[0];
          const matched = Math.min(lot.qty, remaining);
          const buyConv = convertAmount(matched*lot.price, cur, lot.date, 'KRW');
          const sellConv = convertAmount(matched*t.price, cur, t.date, 'KRW');
          if(buyConv.pending || sellConv.pending) pending = true;
          else if(!buyConv.failed && !sellConv.failed){
            closedBuyCost += buyConv.value;
            closedSellProceeds += sellConv.value;
          }
          lot.qty -= matched;
          remaining -= matched;
          if(lot.qty<=0.0000001) lots.shift();
        }
      }
    }
    let holdingQty = lots.reduce((s,l)=>s+l.qty,0);
    let holdingBuyCostKRW = 0;
    if(company.holdingAdjust){
      holdingQty = company.holdingAdjust.qty;
      const conv = convertAmount(holdingQty*company.holdingAdjust.avgPrice, cur, 'latest', 'KRW');
      if(conv.pending) pending = true;
      else if(!conv.failed) holdingBuyCostKRW = conv.value;
    } else {
      lots.forEach(lot=>{
        const conv = convertAmount(lot.qty*lot.price, cur, lot.date, 'KRW');
        if(conv.pending) pending = true;
        else if(!conv.failed) holdingBuyCostKRW += conv.value;
      });
    }
    const hasCurrentPrice = !!company.currentPrice;
    let holdingValueKRW = 0;
    if(holdingQty>0 && hasCurrentPrice){
      const conv = convertAmount(company.currentPrice.value*holdingQty, cur, 'latest', 'KRW');
      if(conv.pending) pending = true;
      else if(!conv.failed) holdingValueKRW = conv.value;
    }
    return {holdingQty, hasCurrentPrice, holdingBuyCostKRW, holdingValueKRW, closedBuyCost, closedSellProceeds, pending};
  }

  // scope: 'all' 이면 전 계좌 합산, 아니면 특정 accountId. 보유 중(미실현) / 청산 완료(실현)를 분리해서 반환.
  function computeSplitSummary(scope){
    let heldBuyCost=0, heldValue=0, closedBuyCost=0, closedSellProceeds=0, pending=false, anyMissingPrice=false;
    let excludedValue=0, excludedCount=0;
    companies.filter(c=> scope==='all' || c.accountId===scope).forEach(c=>{
      const s = computeCompanySplitKRW(c);
      if(s.pending) pending = true;
      if(isCashLikeCompany(c)){
        excludedValue += s.holdingValueKRW;
        if(s.holdingQty>0) excludedCount++;
        return; // 현금으로 표시한 종목 — 매입/평가 합산(수익률 계산)에 넣지 않음
      }
      heldBuyCost += s.holdingBuyCostKRW;
      heldValue += s.holdingValueKRW;
      if(s.holdingQty>0 && !s.hasCurrentPrice) anyMissingPrice = true;
      closedBuyCost += s.closedBuyCost;
      closedSellProceeds += s.closedSellProceeds;
    });
    const heldProfit = heldValue - heldBuyCost;
    const heldReturnPct = heldBuyCost>0 ? (heldProfit/heldBuyCost*100) : null;
    const closedProfit = closedSellProceeds - closedBuyCost;
    const closedReturnPct = closedBuyCost>0 ? (closedProfit/closedBuyCost*100) : null;
    return {heldBuyCost, heldValue, heldProfit, heldReturnPct, closedBuyCost, closedSellProceeds, closedProfit, closedReturnPct, pending, anyMissingPrice, excludedValue, excludedCount};
  }

  const DONUT_COLORS = ['#3fa796','#e8a93e','#e2646b','#6c8ee2','#c77dd1','#52c17e','#d1567d','#4fc3d9','#a3894f','#8b93a3'];

  // 전체 자산 현황 화면은 내부적으로 항상 원화로 계산하고, 표시 직전에만 targetCurrency로 환산한다
  function convertKRWForDisplay(krwValue, targetCurrency){
    targetCurrency = targetCurrency || portfolioCurrency;
    if(targetCurrency==='KRW') return {value: krwValue, pending:false, failed:false};
    // 저장된 시점(스냅샷)을 보는 중이면 실시간 환율이 아니라 그 시점에 고정해 둔 환율을 써야
    // "그때의 자산 현황"이 나중에 환율이 바뀌어도 흔들리지 않는다.
    if(activeUsdRateOverride!==undefined){
      if(!activeUsdRateOverride) return {value:null, pending:false, failed:true};
      return {value: krwValue / activeUsdRateOverride, pending:false, failed:false};
    }
    const r = getEffectiveLatestRate('USD');
    if(r===undefined) return {value:null, pending:true, failed:false};
    if(r===null) return {value:null, pending:false, failed:true};
    return {value: krwValue / r.rate, pending:false, failed:false};
  }
  function fmtPortfolioMoney(krwValue){
    const conv = convertKRWForDisplay(krwValue, portfolioCurrency);
    if(conv.pending) return '<span class="fx-note">환율 조회 중…</span>';
    if(conv.failed) return '<span class="fx-note">환율 조회 실패</span>';
    return fmtMoney(conv.value, portfolioCurrency);
  }
  function fmtAcctMoney(krwValue){
    const conv = convertKRWForDisplay(krwValue, acctSummaryCurrency);
    if(conv.pending) return '<span class="fx-note">환율 조회 중…</span>';
    if(conv.failed) return '<span class="fx-note">환율 조회 실패</span>';
    return fmtMoney(conv.value, acctSummaryCurrency);
  }

  // 계좌(scope)에 등록된 현금(USD/JPY/KRW)을 원화로 환산해서 반환
  function computeCashBucketsKRW(scope){
    const targetAccounts = accounts.filter(a=> scope==='all' || a.id===scope);
    let pending = false;
    const result = {USD:{krw:0}, JPY:{krw:0}, KRW:{krw:0}};
    targetAccounts.forEach(a=>{
      const cash = a.cash || {USD:0,JPY:0,KRW:0};
      ['USD','JPY','KRW'].forEach(cur=>{
        const amt = parseFloat(cash[cur]) || 0;
        if(amt===0) return;
        if(cur==='KRW'){ result[cur].krw += amt; return; }
        const conv = convertAmount(amt, cur, 'latest', 'KRW');
        if(conv.pending){ pending = true; return; }
        if(conv.failed) return;
        result[cur].krw += conv.value;
      });
    });
    result.pending = pending;
    return result;
  }

  // 종목 자체에 "현금으로 표시" 체크가 돼 있거나, 어떤 분류 기준에서든 "현금 취급" 그룹에 배정돼 있으면
  // 실질적으로 현금인 종목으로 본다 (수익률 계산에서 빠지고, 자산 분포에서 현금 영역으로 합산됨)
  function isCashLikeCompany(c){
    if(c.isCash) return true;
    if(!c.groupAssignments) return false;
    return Object.keys(c.groupAssignments).some(schemeId=>{
      const gid = c.groupAssignments[schemeId];
      return groups.some(g=>g.id===gid && g.isCash);
    });
  }

  // breakdown: 'ticker'(종목별) 또는 groupSchemes 중 하나의 id(그 분류 기준으로 보기)
  // 반환하는 각 항목(bucket)은 {name, ticker, value, approx, children} 형태 —
  // children은 그 안에 어떤 자산들이 어떤 비율로 섞여있는지 보여주기 위한 구성 목록.
  function computeAssetDistribution(scope, breakdown){
    breakdown = breakdown || 'ticker';
    const targetCompanies = companies.filter(c=>{
      if(scope!=='all' && c.accountId!==scope) return false;
      return computeStats(c.id).status==='holding';
    });
    const buckets = {};
    let pending = false;

    function addToBucket(key, label, sub, value, approx, childName, childTicker){
      if(!buckets[key]) buckets[key] = {name:label, ticker:sub, value:0, approx:false, children:[]};
      buckets[key].value += value;
      if(approx) buckets[key].approx = true;
      buckets[key].children.push({name:childName, ticker:childTicker||'', value});
    }

    targetCompanies.forEach(c=>{
      const rm = computeReturnMetrics(c.id, 'KRW');
      if(rm.pending){ pending = true; return; }
      if(rm.anyFailed) return;
      let value, approx = false;
      if(rm.hasCurrentPrice){ value = rm.currentValue; }
      else { value = rm.totalBuyCost; approx = true; }
      if(!value || value<=0) return;

      // "현금으로 표시"된 종목(예: SGOV)은 통화 종류와 상관없이 전부 하나의 "현금" 영역으로 합산
      if(isCashLikeCompany(c)){
        addToBucket('cash', '현금', '', value, approx, c.name, c.ticker);
        return;
      }

      if(breakdown!=='ticker'){
        const assignedGroupId = c.groupAssignments && c.groupAssignments[breakdown];
        const group = groups.find(g=>g.id===assignedGroupId);
        const key = group ? group.id : '__none__';
        const label = group ? group.name : '미분류';
        addToBucket(key, label, '', value, approx, c.name, c.ticker);
      } else {
        const key = scope==='all' ? (c.ticker+'|'+c.currency) : c.id;
        addToBucket(key, c.name, c.ticker, value, approx, c.name, c.ticker);
      }
    });

    // 계좌에 직접 입력한 현금도 통화 구분 없이 같은 "현금" 영역에 합산
    const cash = computeCashBucketsKRW(scope);
    if(cash.pending) pending = true;
    ['USD','JPY','KRW'].forEach(cur=>{
      const krw = cash[cur].krw;
      if(!krw || krw<=0) return;
      addToBucket('cash', '현금', '', krw, false, '현금 ('+cur+')', '');
    });

    let list = Object.values(buckets).filter(b=>b.value>0).sort((a,b)=>b.value-a.value);
    const TOP_N = 8;
    if(list.length>TOP_N){
      const top = list.slice(0,TOP_N);
      const rest = list.slice(TOP_N);
      const restChildren = rest.map(b=>({name:b.name, ticker:b.ticker, value:b.value}));
      top.push({name:'기타', ticker:'', value: rest.reduce((s,b)=>s+b.value,0), approx: rest.some(b=>b.approx), children: restChildren});
      list = top;
    }
    // 구성이 자기 자신 하나뿐이면 펼쳐봤자 의미가 없으니 표시하지 않음
    list.forEach(b=>{ if(b.children && b.children.length<=1) b.children = null; });
    const total = list.reduce((s,b)=>s+b.value,0);
    return {list, total, pending};
  }

  function snapshotDateStr(ts){
    const d = new Date(ts);
    const pad = n=>String(n).padStart(2,'0');
    return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate());
  }
  function snapshotTimeStr(ts){
    const d = new Date(ts);
    const pad = n=>String(n).padStart(2,'0');
    return pad(d.getHours())+':'+pad(d.getMinutes());
  }

  // 지금 이 순간의 전체 자산 현황(요약 + 종목별/분류 기준별 자산 분포)을 그대로 굳혀서 저장한다.
  // 현재가·환율 조회가 아직 안 끝났으면(pending) 저장하지 않고 null을 반환 — 호출한 쪽에서 안내 문구를 보여준다.
  // 전체 계좌 합산 + 계좌별로 전부 얼려서 저장 — 스냅샷을 열어본 뒤에도 실시간 화면처럼
  // "범위" 선택으로 계좌를 넘나들며 볼 수 있게 하기 위함.
  function buildPortfolioSnapshot(){
    const scopes = ['all'].concat(accounts.map(a=>a.id));
    const byScope = {};
    for(const scope of scopes){
      const summary = computeSplitSummary(scope);
      if(summary.pending) return null;
      const scopeLabel = scope==='all' ? '전체 계좌 합산' : ((accounts.find(a=>a.id===scope)||{}).name || '');
      const breakdownDefs = [{id:'ticker', label:'종목별'}]
        .concat(groupSchemes.filter(s=>s.accountId===scope).map(s=>({id:s.id, label:s.name})));
      const breakdowns = [];
      for(const bd of breakdownDefs){
        const dist = computeAssetDistribution(scope, bd.id);
        if(dist.pending) return null;
        breakdowns.push({id:bd.id, label:bd.label, dist});
      }
      byScope[scope] = {scopeLabel, summary, breakdowns};
    }
    const rateInfo = getEffectiveLatestRate('USD');
    const fxRateUSD = (rateInfo && typeof rateInfo.rate==='number') ? rateInfo.rate : null;
    return {id:uid(), savedAt:Date.now(), fxRateUSD, byScope};
  }

  function renderDonutChart(list, total, pending){
    if(pending && !list.length) return '<div class="no-trades">현재가·환율 조회 중…</div>';
    if(!list.length || total<=0) return '<div class="no-trades">보유 중인 종목이 없어요.</div>';
    let acc = 0;
    const stops = list.map((b,i)=>{
      const color = DONUT_COLORS[i % DONUT_COLORS.length];
      const startPct = acc/total*100;
      acc += b.value;
      const endPct = acc/total*100;
      return color+' '+startPct.toFixed(3)+'% '+endPct.toFixed(3)+'%';
    }).join(', ');
    const legend = list.map((b,i)=>{
      const color = DONUT_COLORS[i % DONUT_COLORS.length];
      const pct = b.value/total*100;
      const key = b.name+'|'+b.ticker;
      const hasChildren = b.children && b.children.length>1;
      const isOpen = hasChildren && expandedDistBucketKey===key;
      const childrenHtml = isOpen ? (
        '<div style="margin:2px 0 6px 26px;padding-left:10px;border-left:1px solid var(--border-soft);display:flex;flex-direction:column;gap:3px;">'
        + b.children.slice().sort((x,y)=>y.value-x.value).map(ch=>{
            const chPct = b.value>0 ? (ch.value/b.value*100) : 0;
            return '<div style="display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-muted);">'
              +'<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(ch.name)+(ch.ticker?(' <span class="donut-legend-ticker">'+esc(ch.ticker)+'</span>'):'')+'</span>'
              +'<span class="mono" style="width:44px;text-align:right;">'+chPct.toFixed(1)+'%</span>'
              +'<span class="mono" style="width:100px;text-align:right;">'+fmtPortfolioMoney(ch.value)+'</span>'
            +'</div>';
          }).join('')
        + '</div>'
      ) : '';
      return '<div>'
        +'<div class="donut-legend-row" '+(hasChildren?('data-distexpand="'+esc(key)+'" style="cursor:pointer;"'):'')+'>'
          +'<span class="donut-swatch" style="background:'+color+';"></span>'
          +'<span class="donut-legend-name">'+(hasChildren?('<span class="chev" style="margin-right:4px;font-size:9px;">'+(isOpen?'▾':'▸')+'</span>'):'')+esc(b.name)+(b.ticker?(' <span class="donut-legend-ticker">'+esc(b.ticker)+'</span>'):'')+(b.approx?' <span class="fx-note" title="현재가 미입력 — 매입가 기준으로 계산">≈</span>':'')+'</span>'
          +'<span class="donut-legend-pct mono">'+pct.toFixed(1)+'%</span>'
          +'<span class="donut-legend-value mono">'+fmtPortfolioMoney(b.value)+'</span>'
        +'</div>'
        + childrenHtml
      +'</div>';
    }).join('');
    return '<div class="donut-wrap">'
      +'<div class="donut-chart" style="background:conic-gradient('+stops+');">'
        +'<div class="donut-hole"><div class="donut-hole-label">총 평가금액</div><div class="donut-hole-value mono">'+fmtPortfolioMoney(total)+'</div></div>'
      +'</div>'
      +'<div class="donut-legend">'+legend+'</div>'
    +'</div>';
  }

  function renderSplitSummaryGroups(summary){
    const p = summary.pending;
    const heldCards = '<div class="stats-row">'
      +'<div class="stat-card"><div class="stat-label">보유 중 매입금액</div><div class="stat-value mono">'+(p?'<span class="fx-note">조회 중…</span>':fmtPortfolioMoney(summary.heldBuyCost))+'</div></div>'
      +'<div class="stat-card"><div class="stat-label">보유 중 평가금액</div><div class="stat-value mono">'+(p?'<span class="fx-note">조회 중…</span>':(summary.anyMissingPrice?'<span class="fx-note">현재가 필요</span>':fmtPortfolioMoney(summary.heldValue)))+'</div></div>'
      +'<div class="stat-card"><div class="stat-label">평가손익</div><div class="stat-value mono '+(summary.heldProfit>0?'gain':(summary.heldProfit<0?'loss':''))+'">'+(p?'<span class="fx-note">조회 중…</span>':fmtPortfolioMoney(summary.heldProfit))+'</div></div>'
      +'<div class="stat-card"><div class="stat-label">수익률</div><div class="stat-value mono '+(summary.heldReturnPct>0?'gain':(summary.heldReturnPct<0?'loss':''))+'" style="font-size:16px;">'+(p?'<span class="fx-note">조회 중…</span>':(summary.heldReturnPct===null?'-':fmtPct(summary.heldReturnPct)))+'</div></div>'
      +'</div>'
      + (summary.excludedCount>0 ? '<div style="font-size:11.5px;color:var(--text-faint);margin-top:8px;">현금으로 표시한 종목 '+summary.excludedCount+'개 · 평가금액 '+fmtPortfolioMoney(summary.excludedValue)+' (위 수치에 포함 안 됨, 자산 분포에는 현금으로 포함돼요)</div>' : '');
    const closedCards = '<div class="stats-row">'
      +'<div class="stat-card"><div class="stat-label">청산 매입금액</div><div class="stat-value mono">'+(p?'<span class="fx-note">조회 중…</span>':fmtPortfolioMoney(summary.closedBuyCost))+'</div></div>'
      +'<div class="stat-card"><div class="stat-label">청산(매도)금액</div><div class="stat-value mono">'+(p?'<span class="fx-note">조회 중…</span>':fmtPortfolioMoney(summary.closedSellProceeds))+'</div></div>'
      +'<div class="stat-card"><div class="stat-label">실현손익</div><div class="stat-value mono '+(summary.closedProfit>0?'gain':(summary.closedProfit<0?'loss':''))+'">'+(p?'<span class="fx-note">조회 중…</span>':fmtPortfolioMoney(summary.closedProfit))+'</div></div>'
      +'<div class="stat-card"><div class="stat-label">수익률</div><div class="stat-value mono '+(summary.closedReturnPct>0?'gain':(summary.closedReturnPct<0?'loss':''))+'" style="font-size:16px;">'+(p?'<span class="fx-note">조회 중…</span>':(summary.closedReturnPct===null?'-':fmtPct(summary.closedReturnPct)))+'</div></div>'
      +'</div>';
    return '<div style="font-size:12px;color:var(--accent);font-weight:600;margin-bottom:10px;">보유 중인 종목 (미실현)</div>'
      + heldCards
      + '<div class="sidebar-group-label collapsible" data-toggle-closed-overview="1" style="margin:20px 0 10px 0;cursor:pointer;">청산 완료한 종목 (실현) <span class="chev">'+(showClosedOverview?'▾':'▸')+'</span></div>'
      + (showClosedOverview ? closedCards : '');
  }

  // 저장된 시점 목록을 탭으로 표시할 때 쓸 라벨(같은 날짜에 여러 개면 시간까지 붙여서 구분)
  function renderSnapshotTabsHtml(){
    const sorted = portfolioSnapshots.slice().sort((a,b)=>a.savedAt-b.savedAt);
    const dateCounts = {};
    sorted.forEach(s=>{ const d = snapshotDateStr(s.savedAt); dateCounts[d] = (dateCounts[d]||0)+1; });
    const liveTab = '<button class="snapshot-tab '+(viewingSnapshotId===null?'active':'')+'" data-viewsnapshot="">현재</button>';
    const savedTabs = sorted.map(s=>{
      const d = snapshotDateStr(s.savedAt);
      const label = dateCounts[d]>1 ? (d+' '+snapshotTimeStr(s.savedAt)) : d;
      return '<button class="snapshot-tab '+(viewingSnapshotId===s.id?'active':'')+'" data-viewsnapshot="'+s.id+'">'
        + esc(label) + '<span class="snapshot-tab-close" data-delsnapshot="'+s.id+'" title="이 저장 시점 삭제">×</span></button>';
    }).join('');
    return '<div class="snapshot-tabs">'+liveTab+savedTabs+'</div>';
  }

  function renderPortfolioOverview(){
    if(viewingSnapshotId!==null && !portfolioSnapshots.some(s=>s.id===viewingSnapshotId)) viewingSnapshotId = null;
    if(viewingSnapshotId!==null){
      return renderSnapshotOverview(portfolioSnapshots.find(s=>s.id===viewingSnapshotId));
    }

    const scopeOptions = '<option value="all" '+(portfolioScope==='all'?'selected':'')+'>전체 계좌 합산</option>'
      + accounts.map(a=>'<option value="'+a.id+'" '+(portfolioScope===a.id?'selected':'')+'>'+esc(a.name)+'</option>').join('');
    const summary = computeSplitSummary(portfolioScope);
    // 분류 기준은 계좌별로 존재 — 지금 보고 있는 계좌(portfolioScope)의 것만 사용
    const scopedSchemes = groupSchemes.filter(s=>s.accountId===portfolioScope);
    // 선택된 분류 기준이 삭제됐거나 다른 계좌 것이면 종목별로 되돌림
    if(portfolioBreakdown!=='ticker' && !scopedSchemes.some(s=>s.id===portfolioBreakdown)) portfolioBreakdown = 'ticker';
    const dist = computeAssetDistribution(portfolioScope, portfolioBreakdown);

  function fmtShares(n){
    if(n===null||n===undefined||isNaN(n)) return '-';
    let s = n.toFixed(4);
    s = s.replace(/0+$/,'').replace(/\.$/,'');
    return s;
  }
  function fmtPct(n){ const sign = n>0?'+':''; return sign + n.toFixed(1) + '%'; }

  function computeStats(companyId){
    const list = trades.filter(t=>t.companyId===companyId)
      .slice()
      .sort((a,b)=> a.date===b.date ? (a.createdAt-b.createdAt) : (a.date<b.date?-1:1));
    let lots = [];
    let realizedPnL = 0;
    let realizedCost = 0;
    const pnlByTradeId = {};
    for(const t of list){
      if(t.type==='buy'){
        lots.push({qty:t.qty, price:t.price, date:t.date});
      } else {
        let remaining = t.qty;
        let costTotal = 0;
        let matchedQty = 0;
        while(remaining>0 && lots.length>0){
          const lot = lots[0];
          const matched = Math.min(lot.qty, remaining);
          costTotal += matched*lot.price;
          matchedQty += matched;
          lot.qty -= matched;
          remaining -= matched;
          if(lot.qty<=0.0000001) lots.shift();
        }
        const proceeds = matchedQty * t.price;
        const pnl = proceeds - costTotal;
        realizedPnL += pnl;
        realizedCost += costTotal;
        pnlByTradeId[t.id] = matchedQty>0 ? pnl : null;
      }
    }
    let holdingQty = lots.reduce((s,l)=>s+l.qty,0);
    const holdingCost = lots.reduce((s,l)=>s+l.qty*l.price,0);
    let avgPrice = holdingQty ? holdingCost/holdingQty : 0;
    const company = companies.find(c=>c.id===companyId);
    const isAdjusted = !!(company && company.holdingAdjust);
    if(isAdjusted){
      holdingQty = company.holdingAdjust.qty;
      avgPrice = company.holdingAdjust.avgPrice;
    }
    const status = holdingQty>0.0000001 ? 'holding' : (list.length>0 ? 'closed' : 'none');
    const realizedPct = realizedCost>0 ? (realizedPnL/realizedCost*100) : 0;
    return {holdingQty, avgPrice, realizedPnL, realizedPct, status, pnlByTradeId, tradeCount:list.length, list, lots, isAdjusted};
  }

  // 지금 보유 중인 몫에서 FIFO로 qty만큼 덜어낼 때의 평균 원가 — 계좌 이동 시 원가를 그대로 넘겨주기 위해 사용
  function avgCostForQty(companyId, qty){
    const st = computeStats(companyId);
    let remaining = qty, cost = 0, matched = 0;
    for(const lot of st.lots){
      if(remaining<=0) break;
      const take = Math.min(lot.qty, remaining);
      cost += take*lot.price;
      matched += take;
      remaining -= take;
    }
    return matched>0 ? cost/matched : 0;
  }

  function addPeriod(dateStr, freq){
    const d = new Date(dateStr+'T00:00:00');
    if(freq==='daily'){ d.setDate(d.getDate()+1); }

    return d.toISOString().slice(0,10);
  }

  function computeDcaNextDue(company){

    const dcaTrades = trades.filter(t=>t.companyId===company.id && t.isDCA)
      .slice().sort((a,b)=> a.date<b.date?1:-1);
    if(dcaTrades.length){
      return addPeriod(dcaTrades[0].date, plan.frequency);
    }
    return plan.startDate;
  }

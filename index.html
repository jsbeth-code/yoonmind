  // ---------- CSV import helpers ----------
  function splitLine(line, delim){
    const result = [];
    let cur=''; let inQuotes=false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(ch === '"'){
        if(inQuotes && line[i+1]==='"'){ cur+='"'; i++; }
        else inQuotes = !inQuotes;
      } else if(ch===delim && !inQuotes){
        result.push(cur); cur='';
      } else cur+=ch;
    }
    result.push(cur);
    return result.map(s=>s.trim());
  }
  function parseDelimited(text){
    const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
    if(!lines.length) return [];
    const delim = lines[0].includes('\t') ? '\t' : ',';
    return lines.map(line=>splitLine(line, delim));
  }
  // Detects the "완료된 주문" mobile-paste text pattern (Toss app, selected/copied on a phone):
  // a bare date line ("12.29"), then repeating [ticker, "구매완료 · N주", "$price"] groups.
  function looksLikeMobileOrderPaste(text){
    return /(구매완료|판매완료|매수완료|매도완료)\s*[·ㆍ.]\s*[\d.]+\s*주/.test(text);
  }

  function parseMobileOrderText(text, yearOverride){
    const rawLines = text.split(/\r?\n/)
      .map(l=>l.trim().replace(/^[-*•]\s+/, ''))
      .filter(l=>l.length>0);
    const now = new Date();
    let year = now.getFullYear();
    if(yearOverride){ year = parseInt(yearOverride, 10); }
    else{
      for(const l of rawLines){
        const m = l.match(/(\d{4})\s*년\s*(\d{1,2})\s*월/);
        if(m){ year = parseInt(m[1],10); break; }
      }
    }
    const DATE_RE = /^(\d{1,2})\.(\d{1,2})$/;
    const STATUS_RE = /^(구매완료|판매완료|매수완료|매도완료)\s*[·ㆍ.]\s*([\d.]+)\s*주$/;
    const PRICE_RE = /^\$?\s*([\d,]+\.?\d*)\s*(원)?$/;

    let currentDate = null;
    const entries = [];
    for(let i=0;i<rawLines.length;i++){
      const line = rawLines[i];
      const dm = line.match(DATE_RE);
      if(dm){
        currentDate = year+'-'+dm[1].padStart(2,'0')+'-'+dm[2].padStart(2,'0');
        continue;
      }
      const sm = line.match(STATUS_RE);
      if(sm && i>0 && i+1<rawLines.length){
        const ticker = rawLines[i-1];
        const pm = rawLines[i+1].match(PRICE_RE);
        if(pm && currentDate && !DATE_RE.test(ticker) && !STATUS_RE.test(ticker)){
          const side = /구매|매수/.test(sm[1]) ? 'buy' : 'sell';
          const qty = parseFloat(sm[2]);
          const price = parseFloat(pm[1].replace(/,/g,''));
          if(qty>0 && price>0){
            entries.push({
              date: currentDate, name: ticker, ticker: ticker, side, price: String(price), qty: String(qty),
              currency: 'USD', excluded:false
            });
          }
        }
      }
    }
    return entries;
  }

  function detectLedgerHeaderStart(rows2D){
    for(let i=0; i<Math.min(rows2D.length, 8)-2; i++){
      const r0 = (rows2D[i]||[]).join('|');
      const r1 = (rows2D[i+1]||[]).join('|');
      const r2 = (rows2D[i+2]||[]).join('|');
      if(r0.includes('거래일자') && r0.includes('거래종류') && r1.includes('종목코드') && r2.includes('거래소')){
        return i;
      }
    }
    return -1;
  }

  function parseLedgerRows(rows2D, headerStart){
    const dataStart = headerStart + 3;
    const out = [];
    let otherCount = 0;
    for(let i=dataStart; i+2<rows2D.length; i+=3){
      const r1 = rows2D[i] || [];
      const r2 = rows2D[i+1] || [];
      const r3 = rows2D[i+2] || [];
      if(!r1.length || !(r1[0]||'').trim()) continue;
      const kind = (r1[1]||'').trim();
      const action = (r2[1]||'').trim();
      if((kind==='매매' || kind==='소수점매매' || kind==='소액매매') && (action==='매수' || action==='매도')){
        const rawCur = (r1[2]||'').trim().toUpperCase();
        const currency = (rawCur==='KRW'||rawCur==='JPY') ? rawCur : 'USD';
        out.push({
          date: normalizeDate(r1[0]),
          name: (r3[1]||'').trim(),
          ticker: (r2[0]||'').trim(),
          side: action==='매수' ? 'buy' : 'sell',
          price: normalizeNumber(r2[2]),
          qty: normalizeNumber(r1[3]),
          currency,
          excluded: false
        });
      } else {
        otherCount++;
      }
    }
    return {rows: out, otherCount};
  }

  // 토스증권 "거래내역서" PDF 전용 파서 — pdf.js가 페이지별로 돌려주는 텍스트 조각들은
  // 원래 좌표(줄) 정보 없이 뒤섞여 나오므로, 먼저 y좌표로 같은 줄끼리 묶고 x좌표 순으로
  // 정렬해서 pdftotext -layout 과 같은 "줄 단위 텍스트"로 재구성한 다음 그 줄들을 파싱한다.
  function reconstructPdfLines(items){
    const tol = 2; // 같은 줄로 볼 y좌표 오차 허용치(포인트)
    const groups = [];
    items.forEach(it=>{
      if(!it.str || !it.str.trim()) return;
      const x = it.transform[4];
      const y = it.transform[5];
      let g = groups.find(g=>Math.abs(g.y-y)<=tol);
      if(!g){ g = {y, items:[]}; groups.push(g); }
      g.items.push({x, str: it.str});
    });
    groups.sort((a,b)=> b.y - a.y); // PDF 좌표는 위로 갈수록 y가 커짐
    return groups.map(g=>{
      g.items.sort((a,b)=>a.x-b.x);
      return g.items.map(it=>it.str).join(' ');
    });
  }

  function parseTossPdfRows(lines){
    const mainRe = /^(\d{4}\.\d{2}\.\d{2})\s+(구매|판매)\s+(.+?)\s+([\d,]+\.\d+)\s+([\d,]+\.?\d*)\s+([\d,]+)\s+([\d,]+)\s+([\d,]+)\s+([\d,]+)\s+([\d,]+)\s+([\d,]+)\s+([\d,]+\.?\d*)\s+([\d,]+)\s*$/;
    const usdRe = /^\s*\(\$\s*([\d,]+\.?\d*)\)\s+\(\$\s*([\d,]+\.?\d*)\)\s+\(\$\s*([\d,]+\.?\d*)\)\s+\(\$\s*([\d,]+\.?\d*)\)\s+\(\$\s*([\d,]+\.?\d*)\)\s+\(\$\s*([\d,]+\.?\d*)\)\s+\(\$\s*([\d,]+\.?\d*)\)\s*$/;
    const isinInlineRe = /\(([A-Z]{2}[0-9A-Z]{10})\)\s*$/;
    const isinOnlyRe = /^\s*\(([A-Z]{2}[0-9A-Z]{10})\)\s*$/;

    const rows = [];
    let i = 0;
    while(i < lines.length){
      const m = mainRe.exec(lines[i]);
      if(m){
        const [, date, sideKo, namePart, , qty, , , priceKrw] = m;
        let ticker = '', name = namePart.trim();
        const im = isinInlineRe.exec(namePart);
        if(im){ ticker = im[1]; name = namePart.slice(0, im.index).trim(); }

        let j = i+1;
        let usdPrice = '';
        if(j < lines.length){
          const um = usdRe.exec(lines[j]);
          if(um){ usdPrice = um[3]; j++; }
        }
        if(!ticker && j < lines.length){
          const iom = isinOnlyRe.exec(lines[j]);
          if(iom){ ticker = iom[1]; j++; }
        }

        rows.push({
          date: date.replace(/\./g,'-'),
          name,
          ticker,
          side: sideKo==='구매' ? 'buy' : 'sell',
          currency: usdPrice ? 'USD' : 'KRW',
          price: (usdPrice || priceKrw).replace(/,/g,''),
          qty: qty.replace(/,/g,''),
          excluded: false
        });
        i = j;
      } else {
        i++;
      }
    }
    return rows;
  }

  function guessColumnMap(headers){
    const map = {date:-1,name:-1,ticker:-1,side:-1,price:-1,qty:-1};
    headers.forEach((h,idx)=>{
      const hl = (h||'').toLowerCase();
      Object.keys(IMPORT_KEYWORDS).forEach(key=>{
        if(map[key]!==-1) return;
        if(IMPORT_KEYWORDS[key].some(kw=>hl.includes(kw.toLowerCase()))){ map[key]=idx; }
      });
    });
    return map;
  }
  function detectHeaderRowIndex(rows){
    for(let i=0;i<Math.min(rows.length, 20); i++){
      const row = rows[i];
      if(!row) continue;
      const strs = row.map(c=>(c===undefined||c===null)?'':c.toString());
      const nonEmpty = strs.filter(s=>s.trim()!=='').length;
      if(nonEmpty<3) continue;
      const map = guessColumnMap(strs);
      const matched = Object.values(map).filter(v=>v!==-1).length;
      if(matched>=2) return i;
    }
    return 0;
  }
  function normalizeSide(v){
    const s=(v||'').toString();
    if(/매수|buy|매입/i.test(s)) return 'buy';
    if(/매도|sell|매각/i.test(s)) return 'sell';
    return '';
  }
  function normalizeNumber(v){
    if(v===undefined||v===null) return '';
    const cleaned = v.toString().replace(/[^0-9.\-]/g,'');
    return cleaned;
  }
  function normalizeDate(v){
    let s = (v||'').toString().trim();
    s = s.replace(/\s*([-./])\s*/g, '$1'); // e.g. "2026- 07- 03" -> "2026-07-03"
    s = s.split(' ')[0]; // drop a trailing time portion, if any
    s = s.replace(/[./]/g,'-');
    const parts = s.split('-').filter(Boolean);
    if(parts.length===3){
      let [a,b,c] = parts;
      if(a.length===4){
        return a+'-'+b.padStart(2,'0')+'-'+c.padStart(2,'0');
      } else if(c.length===4){
        return c+'-'+a.padStart(2,'0')+'-'+b.padStart(2,'0');
      }
    }
    return s;
  }
  function buildImportRows(){
    const dataLines = importRawTable.slice(1);
    importRows = dataLines.map(cols=>{
      const get = (key)=> importColMap[key]>=0 ? (cols[importColMap[key]]||'') : '';
      return {
        date: normalizeDate(get('date')),
        name: get('name').trim(),
        ticker: get('ticker').trim(),
        side: normalizeSide(get('side')),
        price: normalizeNumber(get('price')),
        qty: normalizeNumber(get('qty')),
        currency: importBatchCurrency,
        excluded: false
      };
    });
  }
  async function executeImport(){
    let created = 0, imported = 0, skipped = 0;
    const targetAccountId = importAccountId || activeAccountId;
    const newCompanyIds = [];
    const newTradeIds = [];
    for(const row of importRows){
      if(row.excluded) continue;
      const price = parseFloat(row.price);
      const qty = parseFloat(row.qty);
      if(!row.date || !row.side || !price || price<=0 || !qty || qty<=0 || (!row.name && !row.ticker)){
        skipped++; continue;
      }
      let company = companies.find(c=>
        c.accountId===targetAccountId && (
          (row.ticker && c.ticker && c.ticker.toLowerCase()===row.ticker.toLowerCase()) ||
          (row.name && c.name && c.name.toLowerCase()===row.name.toLowerCase())
        )
      );
      if(!company){
        company = {id:uid(), accountId: targetAccountId, name: row.name || row.ticker, ticker: row.ticker || '-', sector:'', currency: row.currency||'USD', template:{}, memo:'', dca:null, createdAt:Date.now()};
        companies.push(company);
        newCompanyIds.push(company.id);
        created++;
      }
      const newTrade = {id:uid(), companyId:company.id, type:row.side, date:row.date, price, qty, currency: row.currency||company.currency||'USD', reason:'', isDCA:false, createdAt:Date.now()};
      trades.push(newTrade);
      newTradeIds.push(newTrade.id);
      imported++;
    }
    await saveCompanies();
    await saveTrades();
    if(imported>0){
      lastImportBatch = {tradeIds:newTradeIds, companyIds:newCompanyIds, count:imported, ts:Date.now()};
      await saveLastImportBatch();
    }
    importSummary = {created, imported, skipped};
    activeAccountId = targetAccountId;
    const firstInAccount = companies.find(c=>c.accountId===activeAccountId);
    if(firstInAccount && !selectedId) selectedId = firstInAccount.id;
  }

  async function undoLastImport(){
    if(!lastImportBatch) return;
    const tradeIdSet = new Set(lastImportBatch.tradeIds || []);
    const companyIdSet = new Set(lastImportBatch.companyIds || []);
    trades = trades.filter(t=>!tradeIdSet.has(t.id));
    companies = companies.filter(c=>!companyIdSet.has(c.id));

  function fileToBase64(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result.split(',')[1]);
      reader.onerror = ()=> reject(new Error('파일을 읽는 데 실패했어요.'));
      reader.readAsDataURL(file);
    });
  }

  function base64ToBytes(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++){ bytes[i] = bin.charCodeAt(i); }
    return bytes;
  }

  function detectCharset(peekText){
    const m1 = peekText.match(/encoding\s*=\s*["']([\w-]+)["']/i);
    const m2 = peekText.match(/charset\s*=\s*["']?\s*([\w-]+)/i);
    let charset = m1 ? m1[1] : (m2 ? m2[1] : null);
    if(!charset) return null;
    charset = charset.toLowerCase();
    if(/euc.?kr|ks_?c_?5601|ksc.?5601|cp949|949|uhc/.test(charset)) return 'euc-kr';
    if(/utf-?8/.test(charset)) return 'utf-8';
    return charset;
  }

  function decodeBytesSmart(bytes, peekText){
    const declared = detectCharset(peekText);
    if(declared){
      try{ return new TextDecoder(declared).decode(bytes); }
      catch(e){ /* fall through */ }
    }
    // No (usable) declared charset: most plain CSV/TXT exports from Korean
    // brokerage/HTS tools are EUC-KR/CP949 without any declaration at all.
    // EUC-KR byte sequences are essentially never valid UTF-8, so a strict
    // UTF-8 decode reliably tells the two apart.
    try{
      return new TextDecoder('utf-8', {fatal:true}).decode(bytes);
    }catch(e){
      try{ return new TextDecoder('euc-kr').decode(bytes); }
      catch(e2){ return new TextDecoder('utf-8').decode(bytes); }
    }
  }

  function stripTags(s){
    return s.replace(/<[^>]*>/g,'')
      .replace(/&nbsp;/gi,' ')
      .replace(/&amp;/gi,'&')
      .replace(/&lt;/gi,'<')
      .replace(/&gt;/gi,'>')
      .replace(/&quot;/gi,'"')
      .replace(/&#39;/gi,"'")
      .trim();
  }

  function parseSpreadsheetMLRows(xmlText){
    const rowMatches = xmlText.match(/<(?:\w+:)?Row\b[^>]*>[\s\S]*?<\/(?:\w+:)?Row>/gi) || [];
    return rowMatches.map(rowStr=>{
      const cellMatches = rowStr.match(/<(?:\w+:)?Data\b[^>]*>[\s\S]*?<\/(?:\w+:)?Data>/gi) || [];
      return cellMatches.map(c=>stripTags(c));
    }).filter(r=>r.length>0);
  }

  function parseHtmlTableRows(htmlText){
    const doc = new DOMParser().parseFromString(htmlText, 'text/html');
    const table = doc.querySelector('table');
    if(!table) return [];
    const rows = Array.from(table.querySelectorAll('tr'));
    return rows.map(tr=>
      Array.from(tr.querySelectorAll('td,th')).map(td=>td.textContent.trim())
    ).filter(r=>r.length>0);
  }

  async function analyzeExcelImport(){
    if(!importExcelFile){ importError = '엑셀 파일을 먼저 선택해주세요.'; render(); return; }
    importAnalyzing = true; importError = null; render();
    try{
      const bytes = base64ToBytes(importExcelFile.base64);
      let allRows = [];

      const isZip = bytes[0]===0x50 && bytes[1]===0x4B;
      const isOle = bytes[0]===0xD0 && bytes[1]===0xCF && bytes[2]===0x11 && bytes[3]===0xE0;

      if(isZip || isOle){
        if(typeof XLSX === 'undefined'){ throw new Error('엑셀 처리 라이브러리를 불러오지 못했어요. 잠시 후 다시 시도해주세요.'); }
        const wb = XLSX.read(importExcelFile.base64, {type:'base64'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        allRows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''})
          .map(r=>r.map(c=>(c===undefined||c===null)?'':c.toString()));
      } else {
        // Likely a text-based file mislabeled as .xls: Excel 2003 XML(SpreadsheetML) or an HTML table.
        // Peek at the raw bytes (latin1) just to find a declared charset, then decode properly.
        let peek = '';
        const peekLen = Math.min(bytes.length, 4000);
        for(let i=0;i<peekLen;i++){ peek += String.fromCharCode(bytes[i]); }
        let text;
        try{ text = decodeBytesSmart(bytes, peek); }
        catch(e){ text = new TextDecoder('utf-8').decode(bytes); }

        if(/<(?:\w+:)?Worksheet\b|<(?:\w+:)?Workbook\b/i.test(text)){
          allRows = parseSpreadsheetMLRows(text);
        } else if(/<table/i.test(text)){
          allRows = parseHtmlTableRows(text);
        } else if(text.trim().length){
          // Plain CSV/TSV text (e.g. a .csv file, or a .xls that's really just delimited text)
          allRows = parseDelimited(text);
        } else {
          throw new Error('알 수 없는 파일 형식이에요. xlsx/xls/csv 또는 증권사에서 내려받은 원본 파일을 그대로 올려주세요.');
        }
      }

      allRows = allRows.filter(r=>r.some(c=>(c||'').toString().trim()!==''));
      if(!allRows.length){ throw new Error('시트에서 데이터를 찾지 못했어요.'); }

      const ledgerStart = detectLedgerHeaderStart(allRows);
      if(ledgerStart >= 0){
        const parsed = parseLedgerRows(allRows, ledgerStart);
        if(!parsed.rows.length){ throw new Error('매수/매도 거래를 찾지 못했어요. (입출금·환전 내역만 있을 수 있어요)'); }
        importRows = parsed.rows;
        importParsedAsLedger = true;
        importLedgerOtherCount = parsed.otherCount;
        importSummary = null;
        importStep = 'preview';
        importAnalyzing = false;
        render();
        return;
      }
      importParsedAsLedger = false;

      const headerIdx = detectHeaderRowIndex(allRows);
      importRawTable = allRows.slice(headerIdx);
      importHeaders = importRawTable[0];
      importColMap = guessColumnMap(importHeaders);
      buildImportRows();
      importSummary = null;
      importStep = 'preview';
    }catch(e){
      console.error(e);
      importError = '파일을 읽는 데 실패했어요: ' + e.message;
    }
    importAnalyzing = false;
    render();
  }

  async function analyzePdfImport(){
    if(!importPdfFile){ importError = 'PDF 파일을 먼저 선택해주세요.'; render(); return; }
    importAnalyzing = true; importError = null; render();
    try{
      if(typeof pdfjsLib === 'undefined'){ throw new Error('PDF 처리 라이브러리를 불러오지 못했어요. 잠시 후 다시 시도해주세요.'); }
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const bytes = base64ToBytes(importPdfFile.base64);
      let doc;
      try{
        doc = await pdfjsLib.getDocument({data: bytes, password: importPdfPassword || undefined}).promise;
      }catch(e){
        if(e && (e.name==='PasswordException' || /password/i.test(e.message||''))){
          throw new Error('비밀번호가 없거나 올바르지 않아요. PDF 비밀번호를 입력해주세요.');
        }
        throw e;
      }
      let allLines = [];
      for(let p=1; p<=doc.numPages; p++){
        const page = await doc.getPage(p);
        const content = await page.getTextContent();
        allLines = allLines.concat(reconstructPdfLines(content.items));
      }
      const parsed = parseTossPdfRows(allLines);
      if(!parsed.length){ throw new Error('거래 내역을 찾지 못했어요. 토스증권 "거래내역서" PDF 형식인지 확인해주세요.'); }
      importRows = parsed;
      importParsedAsLedger = true;
      importLedgerOtherCount = 0;
      importSummary = null;
      importStep = 'preview';
    }catch(e){
      console.error(e);
      importError = 'PDF를 읽는 데 실패했어요: ' + e.message;
    }
    importAnalyzing = false;
    render();
  }

  async function analyzeImageImport(){
    if(!ensureApiKey()) return;
    if(!importImageFile){ importError = '이미지를 먼저 선택해주세요.'; render(); return; }
    importAnalyzing = true; importError = null; render();
    try{
      const year = parseInt(importImageYear, 10) || new Date().getFullYear();
      const prompt = '다음은 증권사 앱의 완료된 주문(매매) 내역 캡처 화면입니다. 화면에 보이는 각 거래 행에서 다음 정보를 추출해주세요: '
        + '거래일(화면에 보이는 월.일 형식 그대로, 예: "7.2"), 종목명, 매수/매도 여부(구매완료·매수완료→buy, 판매완료·매도완료→sell), 체결 수량(주, 소수점 포함 가능), 그리고 화면에 표시된 총 결제/정산 금액(숫자만, 통화기호나 콤마 제외).'
        + ' 반드시 아래 JSON 배열 형식으로만 답변하고 다른 설명이나 코드블록 표시는 절대 포함하지 마세요: '
        + '[{"day":"7.2","name":"엔비디아","side":"buy","qty":0.323281,"amount":99987}]';

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: anthropicHeaders(),
        body: JSON.stringify({
          model: ANTHROPIC_MODEL,
          max_tokens: 1000,
          thinking: {type:'disabled'},
          messages: [{
            role:'user',
            content: [
              {type:'image', source:{type:'base64', media_type: importImageFile.mediaType, data: importImageFile.base64}},
              {type:'text', text: prompt}
            ]
          }]
        })
      });
      const data = await response.json();
      if(!response.ok){ throw new Error((data && data.error && data.error.message) || ('HTTP '+response.status)); }
      const textBlock = (data.content||[]).map(b=>b.text||'').join('\n');
      const cleaned = textBlock.replace(/```json/g,'').replace(/```/g,'').trim();
      const parsed = JSON.parse(cleaned);
      if(!Array.isArray(parsed) || !parsed.length){ throw new Error('이미지에서 거래 내역을 찾지 못했어요.'); }

      importRows = parsed.map(item=>{
        const dayParts = (item.day||'').toString().split('.');
        let date = '';
        if(dayParts.length===2){
          date = year + '-' + dayParts[0].padStart(2,'0') + '-' + dayParts[1].padStart(2,'0');
        }
        const qty = item.qty;
        const amount = item.amount;
        const price = (qty && amount) ? (parseFloat(amount)/parseFloat(qty)) : '';
        return {
          date,
          name: item.name || '',
          ticker: '',
          side: item.side==='sell' ? 'sell' : 'buy',
          price: price ? String(price) : '',
          qty: qty ? String(qty) : '',
          currency: importBatchCurrency,
          excluded: false
        };
      });
      importSummary = null;
      importStep = 'preview';
    }catch(e){
      console.error(e);
      importError = '이미지 분석에 실패했어요: ' + e.message;
    }
    importAnalyzing = false;
    render();
  }

            +'<button class="import-btn-secondary" id="import-cancel">취소</button>'
            +'<button class="import-btn-primary" id="import-analyze-excel" '+(importAnalyzing?'disabled':'')+'>분석하기</button>'
          +'</div>';
      } else if(importMode==='pdf'){
        body = modeTabs
          + accountRow
          + '<div class="modal-sub">'
          +'토스증권 앱에서 발급받은 "거래내역서" PDF를 그대로 업로드해주세요. 비밀번호가 걸려있으면 아래에 입력해주세요.'
          +'</div>'
          + (importError ? '<div class="import-error">'+esc(importError)+'</div>' : '')
          +'<div class="import-year-row"><label>PDF 비밀번호 (있는 경우)</label><input type="password" id="import-pdf-password" value="'+esc(importPdfPassword)+'" style="width:140px;" placeholder="예: 생년월일 6자리"></div>'
          +'<div class="image-upload-box">'
            +'<input type="file" accept="application/pdf" id="import-pdf-file">'
            + (importPdfFile ? '<div style="margin-top:10px;font-size:12px;color:var(--text-muted);">선택된 파일: '+esc(importPdfFile.name)+'</div>' : '')
          +'</div>'
          + (importAnalyzing ? '<div class="analyzing-spinner">PDF를 분석하는 중이에요…</div>' : '')
          +'<div class="import-actions">'
            +'<button class="import-btn-secondary" id="import-cancel">취소</button>'
            +'<button class="import-btn-primary" id="import-analyze-pdf" '+(importAnalyzing?'disabled':'')+'>분석하기</button>'
          +'</div>';
      } else {
        body = modeTabs
          + accountRow
          + '<div class="modal-sub">'
          +'증권사 앱의 "완료된 주문" 목록 화면을 캡처해서 올려주세요. AI가 종목명·수량·금액을 읽어서 표로 만들어드려요. (베타 기능이라 결과를 반드시 확인 후 가져와주세요)'
          +'</div>'
          + (importError ? '<div class="import-error">'+esc(importError)+'</div>' : '')
          +'<div class="import-year-row">'
            +'<label>거래 연도</label><input type="number" id="import-image-year" value="'+importImageYear+'">'
            +'<label style="margin-left:14px;">기준 통화</label>'
            +'<select id="import-currency-image"><option value="KRW" '+(importBatchCurrency==='KRW'?'selected':'')+'>원화 (₩)</option><option value="USD" '+(importBatchCurrency==='USD'?'selected':'')+'>달러 ($)</option></select>'
          +'</div>'
          +'<div class="image-upload-box">'
            +'<input type="file" accept="image/*" id="import-image-file">'
            + (importImageFile ? '<div><img class="image-preview" src="data:'+importImageFile.mediaType+';base64,'+importImageFile.base64+'"></div>' : '')
          +'</div>'
          + (importAnalyzing ? '<div class="analyzing-spinner">이미지를 분석하는 중이에요…</div>' : '')
          +'<div class="import-actions">'
            +'<button class="import-btn-secondary" id="import-cancel">취소</button>'
            +'<button class="import-btn-primary" id="import-analyze-image" '+(importAnalyzing?'disabled':'')+'>이미지 분석하기</button>'
          +'</div>';
      }
    } else {
      let mapping = '';
      if(!importParsedAsLedger && (importMode==='csv' || importMode==='excel')){
        const colOptions = (selectedKey)=>{
          let opts = '<option value="-1">— 선택 안함 —</option>';
          importHeaders.forEach((h,idx)=>{
            opts += '<option value="'+idx+'" '+(importColMap[selectedKey]===idx?'selected':'')+'>'+esc(h)+'</option>';
          });
          return opts;
        };
        mapping = '<div class="mapping-row">'
          +['date','name','ticker','side','price','qty'].map(key=>{
            const labelMap = {date:'날짜',name:'종목명',ticker:'티커/코드',side:'매수/매도 구분',price:'체결가',qty:'수량'};
            return '<div class="mapping-group"><label>'+labelMap[key]+'</label><select data-colmap="'+key+'">'+colOptions(key)+'</select></div>';
          }).join('')
          +'</div>';
      }

      let rows = importRows.map((r,idx)=>{
        const sideOpts = '<option value="" '+(r.side===''?'selected':'')+'>-</option>'
          +'<option value="buy" '+(r.side==='buy'?'selected':'')+'>매수</option>'
          +'<option value="sell" '+(r.side==='sell'?'selected':'')+'>매도</option>';
        const curOpts = '<option value="KRW" '+(r.currency==='KRW'?'selected':'')+'>₩</option>'
          +'<option value="USD" '+(r.currency==='USD'?'selected':'')+'>$</option>'
          +'<option value="JPY" '+(r.currency==='JPY'?'selected':'')+'>¥</option>';
        return '<tr class="'+(r.excluded?'excluded':'')+'">'
          +'<td><input type="checkbox" data-rowexclude="'+idx+'" '+(r.excluded?'checked':'')+'></td>'
          +'<td><input type="text" data-rowfield="'+idx+'|date" value="'+esc(r.date)+'" style="width:90px;"></td>'
          +'<td><input type="text" data-rowfield="'+idx+'|name" value="'+esc(r.name)+'" style="width:110px;"></td>'
          +'<td><input type="text" data-rowfield="'+idx+'|ticker" value="'+esc(r.ticker)+'" style="width:70px;"></td>'
          +'<td><select data-rowfield="'+idx+'|side">'+sideOpts+'</select></td>'
          +'<td><select data-rowfield="'+idx+'|currency">'+curOpts+'</select></td>'
          +'<td><input type="text" data-rowfield="'+idx+'|price" value="'+esc(r.price)+'" style="width:80px;"></td>'
          +'<td><input type="text" data-rowfield="'+idx+'|qty" value="'+esc(r.qty)+'" style="width:80px;"></td>'
          +'</tr>';
      }).join('');

      const table = '<div class="preview-wrap"><table class="preview-table">'
        +'<thead><tr><th>제외</th><th>날짜</th><th>종목명</th><th>티커</th><th>구분</th><th>통화</th><th>가격(단가)</th><th>수량</th></tr></thead>'
        +'<tbody>'+rows+'</tbody></table></div>';

      const hint = importMode==='pdf'
        ? '<div class="modal-sub">PDF에서 매수/매도 거래 '+importRows.length+'건을 자동으로 뽑았어요. 값이 이상하면 표에서 직접 고쳐주세요. 기존에 없는 종목은 자동으로 새로 등록돼요.</div>'
        : importParsedAsLedger
        ? '<div class="modal-sub">증권사 원장형 내역(3줄 구조) 또는 모바일 앱에서 복사한 주문내역 텍스트로 인식해서, 매수/매도 거래 '+importRows.length+'건을 자동으로 뽑았어요'+(importLedgerOtherCount?(' (입출금·환전 등 '+importLedgerOtherCount+'건은 매매가 아니라서 제외했어요)'):'')+'. 값이 이상하면 표에서 직접 고쳐주세요.</div>'
        : importMode==='image'
        ? '<div class="modal-sub">AI가 이미지를 읽어 자동으로 채운 표예요. "가격"은 총 결제금액 ÷ 수량으로 계산한 주당 단가예요. 잘못 읽힌 값이 있으면 직접 고쳐주세요. 기존에 없는 종목은 자동으로 새로 등록돼요.</div>'
        : '<div class="modal-sub">열 매핑이 맞는지 확인하고, 필요하면 표에서 직접 값을 수정하거나 행을 제외하세요. 기존에 없는 종목은 자동으로 새로 등록돼요.</div>';

      const targetAccName = (accounts.find(a=>a.id===(importAccountId||activeAccountId))||{}).name || '';
      const accountNote = '<div class="modal-sub"><b style="color:var(--amber);">"'+esc(targetAccName)+'"</b> 계좌로 가져와요.</div>';

      body = accountNote + hint + mapping + table
        + (importSummary ? '<div class="import-summary"><b>'+importSummary.imported+'건 가져오기 완료</b> · 새로 등록된 종목 '+importSummary.created+'개'+(importSummary.skipped?(' · 형식 오류로 제외된 행 '+importSummary.skipped+'개'):'')+(importSummary.imported>0?' · <span class="fx-manual" id="import-undo-inline">방금 가져온 내용 되돌리기</span>':'')+'</div>' : '')
        +'<div class="import-actions">'
          +'<button class="import-btn-secondary" id="import-back">'+(importMode==='csv'?'다시 붙여넣기':'다시 업로드')+'</button>'
          +'<button class="import-btn-secondary" id="import-cancel">닫기</button>'
          +'<button class="import-btn-primary" id="import-confirm">'+(importSummary?'다시 가져오기':'가져오기 확정')+'</button>'
        +'</div>';
    }

    return '<div class="modal-overlay" id="import-overlay">'
      +'<div class="modal-box">'
        +'<div class="modal-header"><h2>거래내역 가져오기</h2><button class="modal-close" id="import-close-x">×</button></div>'
        + body
      +'</div>'
      +'</div>';
  }

  function render(){
    const app = document.getElementById('app');
    if(!dataReady){
      app.innerHTML = '<div style="padding:40px;color:#8b93a3;">불러오는 중…</div>';
      return;
    }

    function renderTickerItem(c){
      const st = computeStats(c.id);
      let pnlHtml = '<span class="ticker-pnl neutral">기록 없음</span>';
      if(st.status==='holding'){
        const rm = computeReturnMetrics(c.id, 'native');
        if(rm.hasCurrentPrice && rm.totalReturnPct!==null){
          const cls = rm.totalReturnPct>=0 ? 'gain':'loss';
          pnlHtml = '<span class="ticker-pnl '+cls+'">보유중 · '+fmtShares(st.holdingQty)+'주 · '+fmtPct(rm.totalReturnPct)+'</span>';
        } else {
          pnlHtml = '<span class="ticker-pnl neutral">보유중 · '+fmtShares(st.holdingQty)+'주 · 현재가 필요</span>';
        }
      } else if(st.status==='closed'){
        const cls = st.realizedPnL>=0 ? 'gain':'loss';
        pnlHtml = '<span class="ticker-pnl '+cls+'">청산 · '+fmtPct(st.realizedPct)+'</span>';
      }
      const dcaTag = (c.dca && c.dca.active) ? '<span class="dca-tag">정기적립</span>' : '';
      return '<div class="ticker-item status-'+st.status+(c.id===selectedId?' active':'')+'" data-select="'+c.id+'">'
        +'<div class="ticker-row1"><span class="ticker-name">'+esc(c.name)+dcaTag+'</span><span class="ticker-code">'+esc(c.ticker)+'</span></div>'
        +'<div class="ticker-row2"><span class="ticker-sector">'+esc(c.sector||'')+'</span>'+pnlHtml+'</div>'
        +'</div>';
    }

    const SIDEBAR_PAGE_SIZE = 10;
    function renderPagedList(items, renderFn, groupKey){
      if(!items.length) return '';
      if(sidebarExpanded[groupKey] || items.length<=SIDEBAR_PAGE_SIZE){
        const collapseLink = items.length>SIDEBAR_PAGE_SIZE
          ? '<div class="fx-manual" data-sidebarcollapse="'+groupKey+'" style="font-size:11px;text-align:center;margin:4px 0;">접어서 '+SIDEBAR_PAGE_SIZE+'개씩 보기</div>' : '';
        return items.map(renderFn).join('') + collapseLink;
      }
      const totalPages = Math.ceil(items.length/SIDEBAR_PAGE_SIZE);
      const page = Math.min(sidebarPage[groupKey]||0, totalPages-1);
      const pageItems = items.slice(page*SIDEBAR_PAGE_SIZE, page*SIDEBAR_PAGE_SIZE+SIDEBAR_PAGE_SIZE);
      const pagerHtml = '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 2px 2px;font-size:11px;color:var(--text-faint);">'
          +'<button data-sidebarpage="'+groupKey+'|prev" '+(page===0?'disabled':'')+' style="background:none;border:1px solid var(--border);border-radius:3px;color:var(--text-muted);padding:3px 8px;cursor:pointer;font-family:inherit;">‹ 이전</button>'
          +'<span>'+(page+1)+' / '+totalPages+'</span>'
          +'<button data-sidebarpage="'+groupKey+'|next" '+(page===totalPages-1?'disabled':'')+' style="background:none;border:1px solid var(--border);border-radius:3px;color:var(--text-muted);padding:3px 8px;cursor:pointer;font-family:inherit;">다음 ›</button>'
        +'</div>'
        +'<div class="fx-manual" data-sidebarexpand="'+groupKey+'" style="font-size:11px;text-align:center;margin-top:2px;">전체 '+items.length+'개 펼쳐보기</div>';
      return pageItems.map(renderFn).join('') + pagerHtml;
    }

    const holdingCompanies = [], closedCompanies = [], noTradeCompanies = [];
    companies.filter(c=>c.accountId===activeAccountId).forEach(c=>{
      const st = computeStats(c.id);
      if(st.status==='holding') holdingCompanies.push(c);
      else if(st.status==='closed') closedCompanies.push(c);
      else noTradeCompanies.push(c);
    });

    let sidebarItems = ''
      + (holdingCompanies.length ? '<div class="sidebar-group-label">보유중 · '+holdingCompanies.length+'</div>' + renderPagedList(holdingCompanies, renderTickerItem, 'holding') : '')
      + (closedCompanies.length ? '<div class="sidebar-group-label collapsible" data-toggle-closed="1">청산 완료 · '+closedCompanies.length+' <span class="chev">'+(showClosedGroup?'▾':'▸')+'</span></div>' + (showClosedGroup ? renderPagedList(closedCompanies, renderTickerItem, 'closed') : '') : '')
      + (noTradeCompanies.length ? '<div class="sidebar-group-label">거래 기록 없음 · '+noTradeCompanies.length+'</div>' + renderPagedList(noTradeCompanies, renderTickerItem, 'notrade') : '');

    let newCompanyPanel = '';
    if(showNewCompanyForm){
      newCompanyPanel = '<div class="new-company-panel">'
        +'<input id="nc-name" placeholder="종목명 (예: Apple Inc.)">'
        +'<input id="nc-ticker" placeholder="티커 (예: AAPL)">'
        +'<input id="nc-sector" placeholder="섹터 (예: Technology) — 선택">'
        +'<select id="nc-currency"><option value="USD">달러 ($) 기준</option><option value="KRW">원화 (₩) 기준</option><option value="JPY">엔화 (¥) 기준</option></select>'
        +'<div class="actions"><button class="btn-confirm" id="nc-confirm">추가</button><button class="btn-cancel" id="nc-cancel">취소</button></div>'
        +'</div>';
    }

    let mainHtml;
    const selected = companies.find(c=>c.id===selectedId);

    if(showPortfolioOverview){
      mainHtml = renderPortfolioOverview();
    } else if(!selected){
      mainHtml = '<div class="empty-state">'
        +'<div class="stamp-icon">記</div>'
        +'<h2>첫 종목을 등록해보세요</h2>'
        +'<p>왼쪽에서 종목을 추가하면 매매 기록, 기업 분석, 정기 적립 플랜을 시작할 수 있어요.</p>'
        +'</div>';
    } else {
      const st = computeStats(selected.id);
      const cur = selected.currency || 'USD';
      const rm = computeReturnMetrics(selected.id, companyViewCurrency);

      const currencyToggle = cur!=='KRW' ? (
        '<div class="currency-toggle">'
        +'<button class="ct-btn '+(companyViewCurrency==='native'?'active':'')+'" data-viewcur="native">'+currencySymbol(cur)+' 원래 통화</button>'
        +'<button class="ct-btn '+(companyViewCurrency==='KRW'?'active':'')+'" data-viewcur="KRW">₩ 원화로</button>'
        +'</div>'
      ) : '';

      let currentPriceHtml;
      if(currentPriceFetching.has(selected.id)){
        currentPriceHtml = '<span class="fx-note">조회 중…</span>';
      } else if(selected.currentPrice){
        currentPriceHtml = '<span class="fx-manual" data-editprice="'+selected.id+'" title="클릭해서 수정">'+viewAmountHtml(selected.currentPrice.value, cur, 'latest', companyViewCurrency)+' ✎</span>'
          + '<div style="font-size:10px;color:var(--text-faint);margin-top:2px;">기준일 '+selected.currentPrice.asOf+' · <span class="fx-manual" data-fetchprice="'+selected.id+'">다시 조회</span></div>';
      } else {
        currentPriceHtml = '<span class="fx-manual" data-fetchprice="'+selected.id+'">현재가 조회</span>'
          + ' <span class="fx-manual" data-editprice="'+selected.id+'" style="margin-left:6px;">직접 입력</span>';
      }

      let returnPctHtml;
      if(rm.pending){
        returnPctHtml = '<span class="fx-note">조회 중…</span>';
      } else if(rm.totalReturnPct===null){
        returnPctHtml = '-';
      } else if(st.status==='holding' && !rm.hasCurrentPrice){
        returnPctHtml = '<span class="fx-note">현재가 필요</span>';
      } else {
        returnPctHtml = fmtPct(rm.totalReturnPct);
      }

      const dispCur = companyViewCurrency==='KRW' ? 'KRW' : cur;
      // 매입금액/평단가는 매수 시점마다 다른 환율로 환산해 합산한 값이라, 단일 "오늘 환율" 표시가
      // 아니라 이 안내를 붙여서 헷갈리지 않게 한다. (단일 환율이 적용되는 현재가와는 다름)
      const perLotFxNote = ' <span class="fx-note" style="opacity:0.8;" title="이 종목의 매수 건마다 그 날짜의 환율로 환산해서 합산한 값이에요.">(매수일별 환율 적용)</span>';
      const fxFailedNote = ' <span class="fx-note" style="color:var(--loss);" title="일부 매수 건의 환율을 못 가져와서 실제보다 적게 계산됐을 수 있어요.">(환율 조회 실패 · 일부 누락)</span>';
      const totalBuyHtml = rm.pending ? '<span class="fx-note">조회 중…</span>' : fmtMoney(rm.totalBuyCost, dispCur) + (companyViewCurrency==='KRW' && cur!=='KRW' ? (rm.anyFailed ? fxFailedNote : perLotFxNote) : '');

      let avgPriceHtml;
      if(st.status==='holding'){
        if(!st.holdingQty){
          avgPriceHtml = '-';
        } else if(companyViewCurrency==='KRW' && cur!=='KRW'){
          // 원화 평단가는 오늘 환율로 native 평단가를 환산하면 안 되고,
          // 보유 중인 각 매수 시점의 환율로 환산한 매입원가를 평균 내야 한다 — rm.totalBuyCost가 이미 그렇게 계산됨
          avgPriceHtml = rm.pending ? '<span class="fx-note">조회 중…</span>' : (rm.totalBuyQty>0 ? fmtMoney(rm.totalBuyCost/rm.totalBuyQty, 'KRW')+(rm.anyFailed?fxFailedNote:perLotFxNote) : '-');
        } else {
          avgPriceHtml = viewAmountHtml(st.avgPrice, cur, 'latest', companyViewCurrency);
        }
      } else if(st.status==='closed'){
        avgPriceHtml = rm.pending ? '<span class="fx-note">조회 중…</span>' : (rm.avgBuyPrice!==null ? fmtMoney(rm.avgBuyPrice, dispCur) : '-');
      } else {
        avgPriceHtml = '-';
      }

      const evalLabel = st.status==='holding' ? '평가금액' : '총 매도금액';
      let evalHtml;
      if(st.status==='holding'){
        evalHtml = rm.pending ? '<span class="fx-note">조회 중…</span>' : (rm.hasCurrentPrice ? fmtMoney(rm.currentValue, dispCur) : '<span class="fx-note">현재가 필요</span>');
      } else if(st.status==='closed'){
        evalHtml = rm.pending ? '<span class="fx-note">조회 중…</span>' : fmtMoney(rm.totalSellProceeds, dispCur);
      } else {
        evalHtml = '-';
      }

      const pnlLabel = st.status==='holding' ? '평가손익' : '실현손익';
      let realizedHtml, realizedClass;
      if(st.status==='holding'){
        if(rm.pending){ realizedHtml = '<span class="fx-note">조회 중…</span>'; realizedClass = ''; }
        else if(!rm.hasCurrentPrice){ realizedHtml = '<span class="fx-note">현재가 필요</span>'; realizedClass = ''; }
        else {
          const unrealized = rm.currentValue - rm.totalBuyCost;
          realizedHtml = fmtMoney(unrealized, dispCur);
          realizedClass = unrealized>0?'gain':(unrealized<0?'loss':'');
        }
      } else if(st.status==='closed'){
        const realizedInView = rm.totalSellProceeds - rm.totalBuyCost;
        realizedHtml = rm.pending ? '<span class="fx-note">조회 중…</span>' : fmtMoney(realizedInView, dispCur);
        realizedClass = realizedInView>0?'gain':(realizedInView<0?'loss':'');
      } else {
        realizedHtml = '-';
        realizedClass = '';
      }

      const adjustBadge = st.isAdjusted ? '<span class="dca-tag" style="background:rgba(232,169,62,0.15);color:var(--amber);margin-left:6px;">직접 수정됨</span>' : '';
      let statsRow = '<div class="stats-row">'
        +'<div class="stat-card"><div class="stat-label">보유 수량 <span class="fx-manual" data-open-holding-adjust="1">✎</span></div><div class="stat-value mono">'+ fmtShares(st.holdingQty || 0) +'주'+adjustBadge+'</div></div>'
        +'<div class="stat-card"><div class="stat-label">평단가 <span class="fx-manual" data-open-holding-adjust="1">✎</span></div><div class="stat-value mono">'+ avgPriceHtml +'</div></div>'
        +'<div class="stat-card"><div class="stat-label">총 매입금액</div><div class="stat-value mono">'+totalBuyHtml+'</div></div>'

  function attachEvents(){
    document.querySelectorAll('[data-account-switch]').forEach(el=>{
      el.addEventListener('click', ()=>{
        activeAccountId = el.getAttribute('data-account-switch');
        const firstInAccount = companies.find(c=>c.accountId===activeAccountId);
        selectedId = firstInAccount ? firstInAccount.id : null;
        showClosedGroup = false;
        render();
      });
    });
    document.querySelectorAll('[data-account-rename]').forEach(el=>{
      el.addEventListener('click', async (e)=>{
        e.stopPropagation();
        const id = el.getAttribute('data-account-rename');
        const acc = accounts.find(a=>a.id===id);

      });
    });

    document.querySelectorAll('[data-rowexclude]').forEach(el=>{
      el.addEventListener('change', ()=>{
        const idx = parseInt(el.getAttribute('data-rowexclude'),10);
        importRows[idx].excluded = el.checked;
        render();
      });
    });

    document.querySelectorAll('[data-rowfield]').forEach(el=>{
      el.addEventListener('change', ()=>{
        const [idx, field] = el.getAttribute('data-rowfield').split('|');
        importRows[parseInt(idx,10)][field] = el.value;
      });
    });

    const importConfirm = document.getElementById('import-confirm');
    if(importConfirm) importConfirm.addEventListener('click', async ()=>{
      await executeImport();
      render();
    });
  }

  loadData();
})();
</script>
</body>
</html>

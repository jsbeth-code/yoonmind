<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>무한매수 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f9; --surface:#ffffff; --surface-2:#f7f8fb; --border:#e6e8ef; --border-2:#eef0f5;
    --text:#161a23; --muted:#6b7280; --faint:#9aa1ad;
    --accent:#5b5bf0; --accent-2:#7c7cf5; --accent-soft:#eef0ff;
    --up:#e5484d; --up-soft:#fff0f0; --down:#2f6fe0; --down-soft:#edf3ff;
    --ok:#1f9d63; --ok-soft:#e8f7ef; --warn:#c77d0a; --warn-soft:#fff6e5;
    --buy:#d93a40; --buy-soft:#fff3f3; --sell:#4b4bd8; --sell-soft:#f1f2ff;
    --radius:16px; --shadow:0 1px 2px rgba(20,24,40,.04),0 6px 20px rgba(20,24,40,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* 두 번 탭 확대 막기 */
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit;font-size:16px}   /* iOS 는 16px 미만 입력칸에 포커스하면 화면을 확대함 */
  .wrap{max-width:560px;margin:0 auto;padding:10px 14px calc(110px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}
  .top h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.3px}
  .top .sub{font-size:12px;color:var(--muted)}
  .icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:var(--text)}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
  .b-acc{background:var(--accent-soft);color:var(--accent)} .b-gray{background:#f0f1f5;color:var(--muted)}
  .b-up{background:var(--up-soft);color:var(--up)}
  .banner{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:12px}
  .card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 15px;margin-bottom:10px}
  .cycle{cursor:pointer;transition:transform .08s}
  .cycle:active{transform:scale(.99)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .title{font-size:16px;font-weight:800;letter-spacing:-.3px}
  .meta{font-size:12px;color:var(--muted);font-weight:500}
  .pnl{text-align:right}
  .pnl .amt{font-size:17px;font-weight:700}
  .pnl .pct{font-size:12px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
  .tline{display:flex;align-items:center;gap:12px;margin:9px 0 6px}
  .tline .t{font-size:15px;font-weight:700;white-space:nowrap} .tline .t small{color:var(--faint);font-weight:500}
  .bar{position:relative;flex:1;height:10px;border-radius:999px;background:linear-gradient(90deg,#eceefe,#e7e9f3)}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .bar .knob{position:absolute;top:-4px;width:6px;height:18px;border-radius:4px;background:var(--accent);box-shadow:0 0 0 3px #fff}
  .bar .mid{position:absolute;top:-3px;width:2px;height:16px;background:#c9cbe0;left:50%}
  .stats{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .stat .k{font-size:12px;color:var(--muted);margin-right:4px} .stat .v{font-size:17px;font-weight:700}
  .fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(80px + env(safe-area-inset-bottom));background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;box-shadow:0 10px 28px rgba(91,91,240,.35)}
  nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:24px;display:flex;gap:4px;padding:4px;box-shadow:var(--shadow)}
  nav.tabs button{border:0;background:transparent;border-radius:18px;padding:6px 18px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
  nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
  nav.tabs svg{width:20px;height:20px}
  .dhead{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .backbtn{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text);box-shadow:var(--shadow)}
  .backbtn:active{background:var(--surface-2)}
  .backbtn svg{width:26px;height:26px}
  .dtitle{flex:1;min-width:0;font-weight:800;font-size:18px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--accent)}
  .preview{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;margin:4px 0 12px}
  #root{transition:transform .18s ease}
  /* 증권사 카드: DB 초록(꽃잎 주황·파랑·연두) / 키움 남색(자홍 화살표) */
  .bc{position:relative;overflow:hidden;border:0;padding:10px 13px 11px;display:flex;flex-direction:column;gap:5px}
  .bc.db{background:linear-gradient(160deg,#f3faf0,#e2f1dc)} .bc.kw{background:linear-gradient(160deg,#f2f5fa,#e1e7f2)}
  .bc .wm{position:absolute;right:-10px;bottom:-14px;height:84px;opacity:.12;pointer-events:none}
  .bc>*{position:relative}
  .bc .blogo{height:17px;width:auto;display:block;align-self:flex-start}
  .bc .nm{font-size:18px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
  .bc.db .nm{color:#1f6e2b} .bc.kw .nm{color:#1d3256}
  .bc .cap{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600;font-size:12px;padding:1px 7px;border-radius:7px;margin-left:6px;vertical-align:2px}
  .bc.db .cap{background:rgba(47,143,58,.12);color:#1f6e2b} .bc.kw .cap{background:rgba(43,69,112,.1);color:#2b4570}
  .bc .sub{font-size:11.5px;color:#5d6472}
  .bc .pnl .amt{font-size:15px} .bc .pnl .pct{font-size:11px}
  .bc .tline{margin:2px 0 1px;gap:10px} .bc .tline .t{font-size:13px}
  .bc .bar{height:7px;background:rgba(255,255,255,.8)} .bc .bar .knob{top:-3px;height:13px;width:5px}
  .bc.db .bar .fill{background:linear-gradient(90deg,#ef6a2a,#8cc63f)} .bc.db .bar .knob{background:#2f8f3a}
  .bc.kw .bar .fill{background:linear-gradient(90deg,#2b4570,#d6338a)} .bc.kw .bar .knob{background:#d6338a}
  .bc .stat .k{font-size:11.5px} .bc .stat .v{font-size:14.5px}
  .bc .badge{font-size:10.5px;padding:2px 7px}
  .blogo-s{height:14px;vertical-align:-2px;margin-right:6px}
  /* 사이클 상세: 홈 카드와 같은 증권사 카드 + 숫자 표 */
  .bc.dcard{padding:12px 14px 13px;gap:6px}
  .bc.dcard .nm{font-size:20px}
  .bc.dcard .pnl .amt{font-size:17px} .bc.dcard .pnl .pct{font-size:12px}
  .bc .ptag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:2px}
  .bc.db .ptag{background:rgba(47,143,58,.12);color:#1f6e2b} .bc.kw .ptag{background:rgba(43,69,112,.1);color:#2b4570}
  .bc .ptag.rev{background:var(--up-soft);color:var(--up)}
  .bc .kv2{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:11.5px;color:#5d6472}
  .bc .kv2>div{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .bc .kv2 b{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px;color:var(--text);margin-left:4px;font-weight:600}
  .bc .kv2 small{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;margin-left:3px;font-weight:600}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border-2);border:1px solid var(--border-2);border-radius:14px;overflow:hidden;margin-bottom:6px}
  .tiles>div{background:var(--surface);padding:8px 10px;min-width:0;display:flex;flex-direction:column;gap:2px}
  .tiles .k{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tiles .v{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:370px){.tiles .v{font-size:12.5px}}
  .actions.a4{grid-template-columns:repeat(4,1fr);gap:6px}
  .actions.a4 .btn{font-size:12.5px;padding:9px 2px;white-space:nowrap}
  .hist2{padding:2px 12px}
  .hist2 .d{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border-2)}
  .hist2 .d:last-child{border-bottom:0}
  .hist2 .dt{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:var(--muted);width:42px;flex:none}
  .hist2 .ln{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .hist2 .ln>div{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
  .hist2 .ln b{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600}
  .hist2 .ln .chip{margin-right:0;font-size:10.5px;padding:2px 6px}
  .hist2 .ln i{font-style:normal;margin-left:auto;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px;color:var(--muted)}
  .hist2 .src{font-size:10.5px;color:var(--faint)}
  .pen{flex:none;width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--accent)}
  .pen svg{width:14px;height:14px}
  .done-it{cursor:pointer}
  .done-it:active{background:var(--surface-2)}
  .bigp{font-size:32px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
  .kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin-top:10px}
  .kv span{color:var(--muted);margin-right:4px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px}
  .grid3 .k{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .grid3 .v{font-size:18px;font-weight:700;margin-top:2px;white-space:nowrap}
  .grid3 .v small{font-size:12px;color:var(--faint);font-weight:600}
  .chart{position:relative;margin-top:6px;touch-action:pan-y}
  .chart svg{width:100%;height:auto;display:block}
  .chart text{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;fill:var(--faint)}
  .tip{position:absolute;top:6px;background:#1d2130;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.55;pointer-events:none;display:none;min-width:130px;white-space:nowrap;z-index:2}
  .tip b{font-family:'IBM Plex Mono',ui-monospace,monospace;float:right;margin-left:12px}
  .tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin-top:6px}
  .legend i{display:inline-block;vertical-align:middle;margin-right:4px}
  .tbl .tr{display:grid;grid-template-columns:minmax(84px,1.25fr) 42px 1fr 40px 1.05fr;gap:4px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border-2);font-size:12.5px}
  .tbl .tr>div{min-width:0;white-space:nowrap}
  .tbl .tr>div:last-child{font-size:12px;letter-spacing:-.3px}
  .tbl .tr>div:nth-child(n+3){text-align:right}
  .tbl .th{font-size:11px;color:var(--faint);padding-top:0}
  .tbl .tr .chip{margin:0;text-align:center}
  .big{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
  .big small{font-size:20px;color:var(--faint);font-weight:600}
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;margin-top:10px}
  .grid4 .k{font-size:12px;color:var(--muted)} .grid4 .v{font-size:18px;font-weight:700;margin-top:1px}
  .sec{font-size:15px;font-weight:800;margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:center}
  .orders{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ocol{border-radius:16px;padding:12px}
  .ocol.buy{background:var(--buy-soft)} .ocol.sell{background:var(--sell-soft)}
  .ocol h4{margin:0 0 6px;font-size:12px;font-weight:700}
  .ocol.buy h4{color:var(--buy)} .ocol.sell h4{color:var(--sell)}
  .ol{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(0,0,0,.05);gap:6px}
  .ol:last-child{border-bottom:0}
  .ol>div{white-space:nowrap;min-width:0}
  .ol .p{font-weight:700;font-size:15px} .ol .q{color:var(--muted);font-size:12px}
  .ol.minor .p{font-weight:600;font-size:13px;color:#7b6060}
  .ol .tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px;white-space:nowrap;flex:none}
  @media (max-width:400px){.ol .p{font-size:14px}.orders{gap:8px}.ocol{padding:10px}}
  .buy .tag{background:#ffdede;color:var(--buy)} .sell .tag{background:#e2e3ff;color:var(--sell)}
  .ol.rej .p{text-decoration:line-through;color:var(--faint)}
  .sep{font-size:10px;color:var(--buy);border-top:1px dashed #f0a8ab;margin:6px 0 2px;padding-top:4px;font-weight:700}
  .note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px;white-space:pre-line}
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 8px;font-weight:700;font-size:14px;color:var(--text)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--up);border-color:#f6caca}
  .btn:disabled{opacity:.5}
  .hist .day{font-size:12px;color:var(--muted);font-weight:700;margin:10px 0 2px;display:flex;justify-content:space-between;align-items:center}
  .hist .day:first-child{margin-top:0}
  .hist .it{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-2)}
  .chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;margin-right:8px}
  .chip.buy{background:var(--buy-soft);color:var(--buy)} .chip.sell{background:var(--sell-soft);color:var(--sell)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}
  .cal .h{font-size:11px;color:var(--faint);padding:4px 0}
  .cal .d{border-radius:12px;padding:6px 0 4px;min-height:48px;font-size:13px;font-weight:600}
  .cal .d.today{outline:2px solid var(--accent)}
  .cal .d.has{background:var(--up-soft)} .cal .d.has.neg{background:var(--down-soft)}
  .cal .d small{display:block;font-size:9px;font-weight:700;margin-top:2px}
  .cal .d.off{color:#c9ccd4}
  .bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:90px;margin-top:12px}
  .bars .b{background:#eceef4;border-radius:6px 6px 2px 2px;min-height:4px;position:relative}
  .bars .b.pos{background:var(--up)} .bars .b.neg{background:var(--down)}
  .bars-l{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;text-align:center;font-size:11px;color:var(--faint);margin-top:4px}
  .done-it{padding:10px 0;border-bottom:1px solid var(--border-2)}
  .done-it:last-child{border-bottom:0}
  .done-it .row>div:first-child{flex:1;min-width:0}
  .done-it .pnl{flex:none}
  .sheet-bg{position:fixed;inset:0;background:rgba(15,18,30,.35);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .sheet-bg.on{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .sheet h3{margin:0 0 12px;font-size:18px}
  .seg{display:flex;background:#eff0f5;border-radius:12px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:700;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--text);box-shadow:var(--shadow)}
  .f{display:block;margin-bottom:10px}
  .f span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
  .f input,.f select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);font-size:16px;color:var(--text)}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .help{font-size:12px;color:var(--muted);line-height:1.6}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#1d2130;color:#fff;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:600;z-index:30;max-width:92vw;display:none}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
  .fillrow{display:grid;grid-template-columns:90px 1fr 1fr 34px;gap:6px;margin-bottom:6px}
  .fillrow select,.fillrow input{padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);width:100%;font-size:16px}
  .x{border:0;background:#f0f1f5;border-radius:10px;color:var(--muted)}
  code{background:#f0f1f5;padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<nav class="tabs" id="tabs" style="display:none">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
  <button data-tab="done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>완료</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
</nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* 무한매수 대시보드 — 데이터는 비공개 저장소(infinite-buy)의 state/dashboard.json 을
   개인 토큰으로 읽어옴. 이 페이지 자체에는 매매 데이터가 없음. */
const LS = k => { try { return localStorage.getItem(k) } catch { return null } };
const SS = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} };
const cfg = { repo: LS('ib.repo') || 'jsbeth-code/infinite-buy', token: LS('ib.token') || '' };
let data = null, view = { tab: 'home', cycle: null, done: null }, tradesOpen = false, calMonth = null, calYear = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = (n, d = 2) => n == null || isNaN(n) ? '-' : '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') + usd(Math.abs(n));
const pct = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(2) + '%';
const cls = n => n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
const BROKER = { DB: 'DB', KIWOOM: '키움' };
const BRAND = {
  DB: { cls: 'db', name: 'DB증권', logo: 'infinite-assets/db_logo.png', mark: 'infinite-assets/db_mark.png' },
  KIWOOM: { cls: 'kw', name: '키움증권', logo: 'infinite-assets/kw_logo.png', mark: 'infinite-assets/kw_mark.png' },
};
const brandLogo = (b, klass = 'blogo-s') => BRAND[b] ? `<img class="${klass}" src="${BRAND[b].logo}" alt="${BRAND[b].name}">` : '';
const man = v => '$' + (+(v / 10000).toFixed(2)).toLocaleString('en-US') + '만';
/* 카드 제목: 이름에서 증권사·자본금 표기를 빼고 "SOXL 3차" 만 (로고·자본금은 따로 보여줌) */
const shortName = c => (String(c.name || '').replace(/DB증권|키움증권|KIWOOM|키움|\bDB\b/g, ' ').replace(/\$[\d,.]+\s*만?/g, ' ').replace(/\s+/g, ' ').trim()) || c.ticker;
/* 새 사이클 자동 제목 (봇 auto_name 과 같은 규칙): 증권사 종목 N차 $자본금, N = 같은 종목 사이클 수 + 1 */
function autoName(broker, ticker, principal) {
  const t = String(ticker || '').toUpperCase().trim();
  if (!t) return '';
  const n = (data?.cycles || []).filter(c => c.ticker === t).length + (data?.completed || []).filter(r => r.ticker === t).length + 1;
  return `${BROKER[broker] || broker} ${t} ${n}차${principal > 0 ? ' ' + man(principal) : ''}`;
}

function toast(msg, ms = 3500) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }

async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${cfg.repo}${path}`, {
    ...opts, headers: { Authorization: `Bearer ${cfg.token}`, 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) } });
  if (!r.ok) throw new Error(`GitHub ${r.status}: ${(await r.text()).slice(0, 160)}`);
  return r;
}

async function load() {
  if (!cfg.token) return render();
  try {
    const r = await gh(`/contents/state/dashboard.json?ref=main&t=${Date.now()}`, { headers: { Accept: 'application/vnd.github.raw+json' } });
    data = await r.json();
  } catch (e) {
    data = { error: String(e.message || e) };
  }
  render();
}

async function control(action, payload, done = '요청을 보냈어요. 1~2분 뒤 반영됩니다.') {
  try {
    await gh('/actions/workflows/control.yml/dispatches', { method: 'POST',
      headers: { Accept: 'application/vnd.github+json' },
      body: JSON.stringify({ ref: 'main', inputs: { action, payload: JSON.stringify(payload || {}) } }) });
    toast(done);
    closeSheet();
    setTimeout(load, 75000);
    setTimeout(load, 150000);
  } catch (e) { toast('실패: ' + e.message, 6000) }
}

/* ── 공통 계산 ── */
function pnl(c) {
  // realized_gross: 실현손익이 수수료 전 매도분 손익 (봇 새 버전). 예전 데이터는 이미 수수료가 빠져 있음
  const total = (c.realized || 0) + (c.unrealized || 0) - (c.realized_gross ? (c.fees || 0) : 0);
  return { total, pct: c.principal ? total / c.principal * 100 : 0 };
}
function statusBadge(c) {
  const p = c.plan || {};
  if (c.paused) return '<span class="badge b-warn">⏸ 일시정지</span>';
  if (!c.auto) return '<span class="badge b-gray">✍️ 직접주문</span>';
  if (p.status === 'placed') return `<span class="badge b-ok">✓ 주문 완료 · ${esc(p.session.slice(5))}</span>`;
  if (p.status === 'dry_run') return `<span class="badge b-acc">모의실행 · ${esc(p.session.slice(5))}</span>`;
  return '<span class="badge b-gray">주문 대기</span>';
}
function tbar(c) {
  const ratio = Math.max(0, Math.min(1, c.T / c.splits));
  return `<div class="bar"><div class="fill" style="width:${ratio * 100}%"></div><div class="mid"></div><div class="knob" style="left:calc(${ratio * 100}% - 3px)"></div></div>`;
}
function priceLine(c) {
  const p = c.price || {};
  if (!p.close) return '';
  const live = p.live ? ` · 진행중 <b class="num">${usd(p.live)}</b> <span class="${cls(p.live - p.close)}">${pct((p.live / p.close - 1) * 100)}</span>` : '';
  return `<div class="meta">종가(${esc(fmtD(p.close_date))}) <b class="num">${usd(p.close)}</b>${live} · ${esc(p.updated || '')} 기준</div>`;
}
const today = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);   // 한국 날짜
const fmtD = s => s && s.length === 8 ? `${s.slice(4, 6)}-${s.slice(6)}` : (s || '');

/* ── 화면 ── */
function render() {
  const root = $('#root');
  $('#tabs').style.display = cfg.token ? 'flex' : 'none';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === view.tab && !view.cycle && !view.done));
  if (!cfg.token || view.tab === 'settings') return root.innerHTML = settingsView();
  if (!data) return root.innerHTML = '<div class="empty">불러오는 중…</div>';
  if (data.error) return root.innerHTML = `<div class="card"><b>불러오기 실패</b><div class="note">${esc(data.error)}</div><div class="help" style="margin-top:8px">토큰 권한(Contents 읽기)과 저장소 이름을 확인하세요. 아직 봇이 한 번도 실행되지 않았다면 dashboard.json 이 없을 수 있어요.</div><div class="actions"><button class="btn" onclick="view.tab='settings';render()">설정</button><button class="btn primary" onclick="control('refresh',{})">데이터 생성</button></div></div>`;
  if (view.cycle) return root.innerHTML = detailView(data.cycles.find(c => c.id === view.cycle));
  if (view.done) { root.innerHTML = doneDetailView((data.completed || []).find(r => r.id === view.done)); return bindChart() }
  root.innerHTML = view.tab === 'done' ? doneView() : homeView();
}

function header(title, sub) {
  return `<div class="top"><div><h1>${title}</h1><div class="sub">${sub || ''}</div></div>
    <button class="icon-btn" title="시세·주문표 갱신" onclick="control('refresh',{},'갱신 요청을 보냈어요. 1~2분 뒤 반영됩니다.')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button></div>`;
}

function homeView() {
  const cs = data.cycles || [];
  let h = header('무한매수', `${esc(data.updated)} 업데이트`);
  if (data.dry_run) h += `<div class="banner">모의실행(dry_run) 중 — 주문표만 계산하고 실제 주문은 넣지 않아요.</div>`;
  if (!cs.length) h += '<div class="empty">진행 중인 사이클이 없어요.<br>오른쪽 아래 <b>새 사이클</b>로 시작하세요.</div>';
  for (const c of cs) {
    const { total, pct: pp } = pnl(c);
    const br = BRAND[c.broker] || {};
    h += `<div class="card cycle bc ${br.cls || ''}" onclick="openCycle('${esc(c.id)}')">
      ${br.mark ? `<img class="wm" src="${br.mark}" alt="">` : ''}
      <div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
        ${br.logo ? `<img class="blogo" src="${br.logo}" alt="${br.name}">` : `<div class="meta">${esc(c.broker)}</div>`}
        <div class="one"><span class="nm">${esc(shortName(c))}</span><span class="cap">${man(c.principal)}</span></div>
        <div class="sub one">${c.splits}분할 · 수수료 −${usd(c.fees)}</div></div>
        <div class="pnl"><div class="amt num ${cls(total)}">${sgn(total)}</div><div class="pct num ${cls(total)}">${pct(pp)}</div></div></div>
      <div class="tline"><div class="t num">T${c.T.toFixed(2)} <small>/ ${c.splits}</small></div>${tbar(c)}</div>
      <div class="row"><div class="stats"><div class="stat"><span class="k">보유</span><span class="v num">${c.qty}</span><span class="k">주</span></div>
        <div class="stat"><span class="k">평단</span><span class="v num">${usd(c.avg)}</span></div></div>${statusBadge(c)}</div></div>`;
  }
  h += `<button class="fab" onclick="openNew()">＋ 새 사이클</button>`;
  return h;
}

function orderCols(c) {
  const p = c.plan;
  if (!p) return '<div class="card"><div class="empty">아직 주문표가 없어요. 다음 실행 때 계산됩니다.</div></div>';
  const buys = p.orders.filter(o => o.side === 'buy'), sells = p.orders.filter(o => o.side === 'sell');
  const tagName = o => ({ first: '첫매수', star_half: `★${p.star_pct?.toFixed(1)}%`, avg_half: '평단', star_full: `★${p.star_pct?.toFixed(1)}%`, bignum: '큰수', rev_buy: '쿼터매수', quarter: `★${p.star_pct?.toFixed(1)}%`, target: '지정가', rev_sell: '5일평균', rev_moc: 'MOC' }[o.tag] || '');
  let b = '', firstLadder = true;
  for (const o of buys) {
    if (o.tag === 'ladder' && firstLadder) { b += '<div class="sep">폭락 대비</div>'; firstLadder = false }
    const minor = o.tag === 'ladder';
    b += `<div class="ol ${minor ? 'minor' : ''} ${o.status === 'rejected' ? 'rej' : ''}"><div><span class="p num">${usd(o.price)}</span> <span class="q">× ${o.qty}주</span></div>${minor ? '' : `<span class="tag">${esc(tagName(o))}</span>`}</div>`;
  }
  let s = '';
  for (const o of sells) s += `<div class="ol ${o.status === 'rejected' ? 'rej' : ''}"><div><span class="p num">${o.kind === 'MOC' ? '시장가' : usd(o.price)}</span> <span class="q">× ${o.qty}주</span></div><span class="tag">${esc(tagName(o))}</span></div>`;
  const st = { placed: '✓ 주문 완료', dry_run: '모의실행 (주문 안 함)', paused: '⏸ 일시정지 — 주문 안 함', manual: '✍️ 직접 주문하세요', preview: '미리보기 (주문 시간 전)' }[p.status] || p.status;
  return `<div class="sec"><span>주문표 · ${esc(p.session)}</span><span class="meta">${esc(st)}</span></div>
    <div class="orders"><div class="ocol buy"><h4>매수 · LOC</h4>${b || '<div class="q">없음</div>'}</div>
    <div class="ocol sell"><h4>매도 · ${sells.some(o => o.kind === 'MOC') ? 'MOC' : 'LOC · 지정가'}</h4>${s || '<div class="q">없음</div>'}</div></div>
    <div class="note">전일종가 ${usd(p.prev_close)} · ${c.mode === 'reverse' ? '쿼터매수금' : '1회매수금'} ${usd(p.unit)}\n${(p.summary || []).map(x => esc(x.trim())).join('\n')}</div>`;
}

function fillsBy(c) {
  const by = {};
  for (const x of c.fills || []) (by[x.session] = by[x.session] || []).push(x);
  return by;
}
const PEN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M11 2.5l2.5 2.5L6 12.5 3 13l.5-3z"/></svg>';
function historyView(c) {
  const by = fillsBy(c);
  if (!Object.keys(by).length) return '<div class="card"><div class="empty">아직 체결 기록이 없어요.</div></div>';
  const src = { manual: '직접입력', edited: '수정함', imported: '넘겨받음' };
  let h = '';
  for (const d of Object.keys(by).sort().reverse()) {
    h += `<div class="d"><span class="dt">${esc(d.slice(5))}</span><div class="ln">${by[d].map(x =>
      `<div><span class="chip ${x.side}">${x.side === 'buy' ? '매수' : '매도'}</span><b>${usd(x.price)}</b>×${x.qty}${src[x.source] ? ` <span class="src">${src[x.source]}</span>` : ''}<i>${usd(x.amount)}</i></div>`).join('')}</div>
      <button class="pen" aria-label="${esc(d)} 기록 수정" onclick="openHist('${esc(c.id)}','${esc(d)}')">${PEN}</button></div>`;
  }
  return `<div class="card hist2">${h}</div>`;
}

function detailView(c) {
  if (!c) { view.cycle = null; return homeView() }
  const { total, pct: pp } = pnl(c);
  const br = BRAND[c.broker] || {}, p = c.price || {}, rev = c.mode === 'reverse';
  const live = p.live ? `<div>현재가<b>${usd(p.live)}</b><small class="${cls(p.live - p.close)}">${pct((p.live / p.close - 1) * 100)}</small></div>` : '';
  const tile = (k, v, klass = '') => `<div><span class="k">${k}</span><span class="v ${klass}">${v}</span></div>`;
  return `<div class="dhead"><button class="backbtn" aria-label="뒤로" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="dtitle">사이클</div>${statusBadge(c)}</div>
  <div class="card bc dcard ${br.cls || ''}">
    ${br.mark ? `<img class="wm" src="${br.mark}" alt="">` : ''}
    ${br.logo ? `<img class="blogo" src="${br.logo}" alt="${br.name}">` : `<div class="meta">${esc(c.broker)}</div>`}
    <div class="row" style="align-items:flex-start"><div style="min-width:0">
        <div class="one"><span class="nm">${esc(shortName(c))}</span><span class="cap">${man(c.principal)}</span></div>
        <div class="sub" style="margin-top:3px">${c.splits}분할 · <span class="ptag ${rev ? 'rev' : ''}">${esc(c.phase)}</span></div></div>
      <div class="pnl"><div class="amt num ${cls(total)}">${sgn(total)}</div><div class="pct num ${cls(total)}">${pct(pp)}</div></div></div>
    <div class="tline"><div class="t num">T${c.T.toFixed(2)} <small>/ ${c.splits}</small></div>${tbar(c)}</div>
    <div class="kv2"><div>보유<b>${c.qty}</b>주</div><div>평단<b>${usd(c.avg)}</b></div>
      ${p.close ? `<div>종가 ${esc(fmtD(p.close_date))}<b>${usd(p.close)}</b></div>` : ''}${live}</div>
  </div>
  <div class="tiles">
    ${tile('투입금액', usd(c.net_invested))}${tile('평가금액', usd(c.eval))}${tile('잔금', usd(c.cash))}
    ${tile(rev ? '쿼터매수금' : '1회 매수금', usd(c.unit))}${tile(rev ? '별지점(5일평균)' : '☆%', c.star_pct != null ? c.star_pct.toFixed(2) + '%' : '-')}${tile('수수료', '−' + usd(c.fees), 'down')}
    ${c.realized ? tile('실현(매도)', sgn(c.realized), cls(c.realized)) + tile('평가손익', sgn(c.unrealized), cls(c.unrealized)) + tile('원금', usd(c.principal)) : ''}
  </div>
  <div class="meta" style="margin:0 2px">평가손익 <span class="num ${cls(c.unrealized)}">${sgn(c.unrealized)}</span> · 수수료율 ${(c.fee_rate * 100).toFixed(3)}% · 손익은 수수료 차감 후${p.updated ? ' · ' + esc(p.updated) + ' 기준' : ''}</div>
  <div class="actions a4">
    ${c.paused ? `<button class="btn primary" onclick="confirmDo('resume','${esc(c.id)}','재개할까요? 다음 주문 시간부터 자동 주문합니다.')">▶ 재개</button>`
               : `<button class="btn" onclick="confirmDo('pause','${esc(c.id)}','일시정지할까요? 이미 접수된 오늘 주문은 MTS에서 직접 취소해야 해요.')">⏸ 일시정지</button>`}
    <button class="btn" onclick="openEdit('${esc(c.id)}')">✏️ 수정</button>
    <button class="btn" onclick="toggleAuto('${esc(c.id)}', ${!c.auto})">${c.auto ? '✋ 직접 주문' : '🤖 자동 켜기'}</button>
    <button class="btn danger" onclick="confirmDo('stop','${esc(c.id)}','이 사이클을 종료할까요? 남은 보유분은 그대로 두고 기록만 마감합니다. 미체결 주문은 MTS에서 취소하세요.')">⏹ 종료</button>
  </div>
  ${!c.auto ? `<div class="actions" style="grid-template-columns:1fr"><button class="btn primary" onclick="openFill('${esc(c.id)}')">✍️ 체결 입력</button></div>` : ''}
  ${orderCols(c)}
  <div class="sec"><span>매매 기록 <span class="meta">${(c.fills || []).length}건</span></span><button class="mini" onclick="openHist('${esc(c.id)}','')">＋ 기록 추가</button></div>
  ${historyView(c)}`;
}

function doneView() {
  const rows = data.completed || [];
  const now = new Date();
  if (calYear == null) { calYear = now.getFullYear(); calMonth = now.getMonth() }
  const byDay = {}, byMonth = Array(12).fill(0);
  for (const r of rows) {
    const p = parseFloat(r.profit) || 0;
    byDay[r.ended] = (byDay[r.ended] || 0) + p;
    const [y, m] = r.ended.split('-').map(Number);
    if (y === calYear) byMonth[m - 1] += p;
  }
  const first = new Date(calYear, calMonth, 1), days = new Date(calYear, calMonth + 1, 0).getDate();
  const monthSum = Object.entries(byDay).filter(([d]) => d.startsWith(`${calYear}-${String(calMonth + 1).padStart(2, '0')}`)).reduce((a, [, v]) => a + v, 0);
  let cal = ['일', '월', '화', '수', '목', '금', '토'].map(d => `<div class="h">${d}</div>`).join('');
  for (let i = 0; i < first.getDay(); i++) cal += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const key = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const v = byDay[key], wd = new Date(calYear, calMonth, d).getDay();

const CH = { W: 340, H: 210, L: 46, R: 8, T: 10, B: 22 };
function chartSvg(series) {
  const pts = series.filter(x => x.c != null || x.b.length || x.s.length);
  chartData = pts;
  if (pts.length < 2) return '<div class="empty">그래프 데이터가 부족해요</div>';
  const vals = pts.flatMap(x => [x.c, x.avg, ...x.b, ...x.s]).filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * .06 || 1; lo -= pad; hi += pad;
  const { W, H, L, R, T, B } = CH, pw = W - L - R, ph = H - T - B, n = pts.length;
  const X = i => L + i / (n - 1) * pw, Y = v => T + (hi - v) / (hi - lo) * ph;
  chartScale = { X, Y, n, pw };
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4, y = Y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#eef0f5"/><text x="${L - 4}" y="${y + 3}" text-anchor="end">$${v.toFixed(v >= 100 ? 0 : 2)}</text>`;
  }
  const step = Math.max(1, Math.round((n - 1) / 6)), ticks = [];
  for (let i = 0; i < n; i += step) ticks.push(i);
  if (n - 1 - ticks[ticks.length - 1] < step * .6) ticks.pop();
  ticks.push(n - 1);                                         // 마지막 날짜는 항상 표시, 오른쪽 끝에 맞춤
  for (const i of ticks) g += `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${md(pts[i].d)}</text>`;
  const close = pts.map((x, i) => x.c == null ? null : `${X(i).toFixed(1)},${Y(x.c).toFixed(1)}`).filter(Boolean).join(' ');
  let avg = '', pen = false;
  pts.forEach((x, i) => {
    if (x.avg == null) { pen = false; return }
    avg += `${pen ? 'H' + X(i).toFixed(1) + ' V' : 'M' + X(i).toFixed(1) + ' '}${Y(x.avg).toFixed(1)} `;
    pen = true;
  });
  const dots = pts.map((x, i) => x.b.map(p => `<circle cx="${X(i)}" cy="${Y(p)}" r="2.6" fill="var(--buy)"/>`).join('') +
    x.s.map(p => `<circle cx="${X(i)}" cy="${Y(p)}" r="3" fill="var(--down)"/>`).join('')).join('');
  return `<svg viewBox="0 0 ${W} ${H}" id="chartSvg">${g}<polyline points="${close}" fill="none" stroke="#c3c7d3" stroke-width="1.4"/>
    <path d="${avg}" fill="none" stroke="#f0a020" stroke-width="1.6" stroke-dasharray="4 3"/>${dots}
    <line id="cursor" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#8b90a0" stroke-width=".8" style="display:none"/></svg>`;
}
let chartData = [], chartScale = null;
function bindChart() {
  const box = $('#chart'), svg = $('#chartSvg');
  if (!box || !svg || !chartScale) return;
  const show = ev => {
    const r = svg.getBoundingClientRect(), k = CH.W / r.width;
    const x = (ev.clientX - r.left) * k, { X, n, pw } = chartScale;
    const i = Math.max(0, Math.min(n - 1, Math.round((x - CH.L) / pw * (n - 1))));
    const p = chartData[i], cur = $('#cursor');
    cur.setAttribute('x1', X(i)); cur.setAttribute('x2', X(i)); cur.style.display = '';
    const tip = $('#tip');
    tip.innerHTML = `<div style="color:#aab">${p.d.replace(/-/g, '.')}</div>` +
      (p.c != null ? `<div><i style="background:#c3c7d3;border-radius:1px;height:2px"></i>종가 <b>${usd(p.c)}</b></div>` : '') +
      (p.avg != null ? `<div><i style="background:#f0a020;border-radius:1px;height:2px"></i>평단가 <b>${usd(p.avg)}</b></div>` : '') +
      p.b.map(v => `<div><i style="background:var(--buy)"></i>매수 <b>${usd(v)}</b></div>`).join('') +
      p.s.map(v => `<div><i style="background:var(--down)"></i>매도 <b>${usd(v)}</b></div>`).join('');
    tip.style.display = 'block';
    const px = X(i) / k, left = px > r.width / 2 ? px - tip.offsetWidth - 10 : px + 10;

}

   <div class="f2"><label class="f"><span>증권사</span><select id="nBroker" onchange="syncFee();syncName()"><option value="DB">DB (자동 주문)</option><option value="KIWOOM">키움 (자동 주문)</option></select></label>
   <label class="f"><span>종목</span><input id="nTicker" value="SOXL" oninput="syncName()"></label></div>
   <div class="f2"><label class="f"><span>원금 (USD)</span><input id="nPrin" inputmode="decimal" placeholder="100000" oninput="syncName()"></label>
   <label class="f"><span>분할</span><select id="nSplits"><option>40</option><option>30</option><option>20</option></select></label></div>
   <div class="f2"><label class="f"><span>기준% (비우면 SOXL 20·TQQQ 15)</span><input id="nBase" inputmode="decimal"></label>
   <label class="f"><span>수수료율 % (계좌 기본값)</span><input id="nFee" inputmode="decimal"></label></div>
   ${imp ? `<div class="f2"><label class="f"><span>현재 T</span><input id="nT" inputmode="decimal" placeholder="5.5"></label><label class="f"><span>보유 수량</span><input id="nQty" inputmode="numeric"></label></div>
   <div class="f2"><label class="f"><span>매수금 (누적 매수액)</span><input id="nBought" inputmode="decimal" placeholder="16788.49"></label><label class="f"><span>매도금 (없으면 0)</span><input id="nSold" inputmode="decimal" value="0"></label></div>
   <div class="f2"><label class="f"><span>평단 (비우면 매수금÷수량)</span><input id="nAvg" inputmode="decimal"></label><label class="f"><span>지금까지 수수료 ($)</span><input id="nFees" inputmode="decimal" placeholder="11.76"></label></div>
   <label class="f"><span>시작일</span><input id="nStart" type="date" value="${today()}"></label>
   <div class="help" style="margin-bottom:10px">넘겨받은 날 이미 앱/MTS로 넣은 주문이 있으면, 그날 체결이 끝난 다음(다음날 아침)에 넘겨받으세요.</div>` : ''}
   <button class="btn primary" style="width:100%" onclick="submitNew()">${imp ? '넘겨받기' : '시작'}</button>`);
  syncFee(); nameTouched = false; syncName();
};
let nameTouched = false;
window.syncName = () => { if (!nameTouched && $('#nName')) $('#nName').value = autoName(val('nBroker'), val('nTicker'), +val('nPrin')) };
window.syncFee = () => { const r = data?.accounts?.[val('nBroker')]; if (r != null) $('#nFee').value = +(r * 100).toFixed(4) };
window.submitNew = () => {
  const p = { name: val('nName'), broker: val('nBroker'), ticker: val('nTicker').toUpperCase(), principal: +val('nPrin'), splits: +val('nSplits') };
  if (val('nBase')) p.base_pct = +val('nBase');
  if (val('nFee')) p.fee_rate = +val('nFee');
  if (!p.ticker || !(p.principal > 0)) return toast('종목과 원금을 입력하세요');
  if (newMode === 'import') {
    Object.assign(p, { T: +val('nT'), qty: +val('nQty'), bought_amt: +val('nBought'), sold_amt: +val('nSold') || 0, started: val('nStart') });
    if (val('nAvg')) p.avg = +val('nAvg');
    if (val('nFees')) p.fees = +val('nFees');
    if (!(p.qty > 0) || !(p.bought_amt > 0) || isNaN(p.T)) return toast('T·수량·매수금을 입력하세요');
  }
  const brokerName = BROKER[p.broker];
  if (confirm(`${newMode === 'import' ? '넘겨받기' : '시작'}: ${p.name || p.ticker} · ${brokerName} · ${usd(p.principal, 0)} · ${p.splits}분할`)) control(newMode, p);
};

window.openEdit = id => {
  const c = data.cycles.find(x => x.id === id);
  openSheet(`<h3>사이클 수정</h3>
   <label class="f"><span>이름</span><input id="eName" value="${esc(c.name)}"></label>
   <label class="f"><span>원금 (USD) — 바꾸면 차액만큼 잔금도 같이 바뀜</span><input id="ePrin" inputmode="decimal" value="${c.principal}"></label>
   <label class="f"><span>수수료율 % (앞으로 체결분부터 적용)</span><input id="eFee" inputmode="decimal" value="${+(c.fee_rate * 100).toFixed(4)}"></label>
   <button class="btn primary" style="width:100%" onclick="submitEdit('${esc(id)}')">저장</button>`);
};
window.submitEdit = id => control('edit', { id, name: val('eName'), principal: +val('ePrin'), fee_rate: +val('eFee') });

window.openFill = id => {
  const c = data.cycles.find(x => x.id === id);
  openSheet(`<h3>체결 입력 · ${esc(c.name)}</h3>
   <div class="help" style="margin-bottom:10px">세션 ${esc(c.plan?.session || '')} 에 실제로 체결된 내역을 입력하세요. 체결이 없었으면 비워서 저장하면 돼요.</div>
   <div id="fRows"></div>
   <button class="btn" style="width:100%;margin-bottom:10px" onclick="addFillRow()">＋ 줄 추가</button>
   <button class="btn primary" style="width:100%" onclick="submitFill('${esc(id)}','${esc(c.plan?.session || '')}')">저장</button>`);
  addFillRow();
};
window.addFillRow = () => {
  const d = document.createElement('div'); d.className = 'fillrow';
  d.innerHTML = '<select><option value="buy">매수</option><option value="sell">매도</option></select><input placeholder="가격" inputmode="decimal"><input placeholder="수량" inputmode="numeric"><button class="x" onclick="this.parentNode.remove()">×</button>';
  $('#fRows').appendChild(d);
};
window.submitFill = (id, session) => {
  const fills = [...document.querySelectorAll('#fRows .fillrow')].map(r => { const [s, p, q] = r.querySelectorAll('select,input'); return { side: s.value, price: +p.value, qty: +q.value } }).filter(f => f.price > 0 && f.qty > 0);
  if (confirm(`${session} 체결 ${fills.length}건 저장할까요?`)) control('fill', { id, session, fills });
};

/* ── 매매 기록 수정: 그 날짜 기록을 통째로 바꾸고 장부(보유·평단·잔금)도 차이만큼 다시 계산 ── */
let hist = null;
window.openHist = (id, session) => {
  const c = data.cycles.find(x => x.id === id);
  hist = { id, c, tDirty: false };
  openSheet(`<h3>매매 기록 · ${esc(c.name)}</h3>
   <label class="f"><span>날짜 (미국 장 기준)</span><input id="hsDate" type="date" value="${esc(session || today())}" onchange="loadHistDay()"></label>
   <div id="hsRows"></div>
   <button class="btn" style="width:100%;margin-bottom:10px" onclick="addHistRow()">＋ 줄 추가</button>
   <label class="f"><span>이 수정 뒤 T (매수가 새로 생기면 +1, 별지점 절반만 체결이면 +0.5, 없어지면 −1)</span><input id="hsT" inputmode="decimal" oninput="hist.tDirty=true;histPreview()"></label>
   <div class="preview" id="hsPrev"></div>
   <div id="hsWarn" class="help" style="margin-bottom:10px"></div>
   <div class="actions" style="grid-template-columns:1fr 1fr;margin-top:0"><button class="btn danger" id="hsDel" onclick="submitHist(true)">이 날 기록 삭제</button><button class="btn primary" onclick="submitHist(false)">저장</button></div>`);
  loadHistDay();
};
window.loadHistDay = () => {
  const d = val('hsDate'), old = fillsBy(hist.c)[d] || [];
  hist.old = old; hist.tDirty = false;
  $('#hsRows').innerHTML = '';
  for (const x of old) addHistRow(x);
  if (!old.length) addHistRow();
  $('#hsDel').style.display = old.length ? '' : 'none';
  const pend = hist.c.pending && hist.c.plan && hist.c.plan.session === d;
  $('#hsWarn').textContent = pend ? '⚠️ 이 날은 아직 체결 확인 전이에요. 다음날 아침 체결이 반영된 뒤 고칠 수 있어요.' : '';
  histPreview();
};
window.addHistRow = (x = {}) => {
  const d = document.createElement('div'); d.className = 'fillrow';
  d.innerHTML = `<select onchange="histPreview()"><option value="buy">매수</option><option value="sell" ${x.side === 'sell' ? 'selected' : ''}>매도</option></select><input placeholder="가격" inputmode="decimal" value="${x.price ?? ''}" oninput="histPreview()"><input placeholder="수량" inputmode="numeric" value="${x.qty ?? ''}" oninput="histPreview()"><button class="x" onclick="this.parentNode.remove();histPreview()">×</button>`;
  $('#hsRows').appendChild(d);
};
const histRows = () => [...document.querySelectorAll('#hsRows .fillrow')].map(r => { const [s, p, q] = r.querySelectorAll('select,input'); return { side: s.value, price: +p.value, qty: Math.round(+q.value) } }).filter(f => f.price > 0 && f.qty > 0);
function ledgerAfter(c, old, rows) {   // 봇 ledger_delta 와 같은 계산
  const sum = (a, side, k) => a.filter(r => r.side === side).reduce((t, r) => t + (k === 'amt' ? (r.amount ?? r.price * r.qty) : r.qty), 0);
  const dbq = sum(rows, 'buy', 'q') - sum(old, 'buy', 'q'), dba = sum(rows, 'buy', 'amt') - sum(old, 'buy', 'amt');
  const dsq = sum(rows, 'sell', 'q') - sum(old, 'sell', 'q'), dsa = sum(rows, 'sell', 'amt') - sum(old, 'sell', 'amt');
  const qb = c.qty + dbq, qty = qb - dsq, fee = (dba + dsa) * (c.fee_rate || 0);
  return { qty, avg: qb > 0 && qty > 0 ? (c.avg * c.qty + dba) / qb : 0, cash: c.cash + dsa - dba - fee, bad: qb < 0 || qty < 0 };
}
window.histPreview = () => {
  const c = hist.c, rows = histRows(), old = hist.old || [];
  if (!hist.tDirty) {
    const had = old.some(r => r.side === 'buy'), has = rows.some(r => r.side === 'buy');
    $('#hsT').value = +(Math.max(0, c.T + (has && !had ? 1 : !has && had ? -1 : 0))).toFixed(4);
  }
  const a = ledgerAfter(c, old, rows);
  $('#hsPrev').innerHTML = a.bad ? '⚠️ 보유수량이 음수가 돼요. 기록을 확인하세요.'
    : `지금 T${c.T.toFixed(2)} · ${c.qty}주 · 평단 <b class="num">${usd(c.avg)}</b> · 잔금 <b class="num">${usd(c.cash)}</b><br>저장 후 T${(+$('#hsT').value || 0).toFixed(2)} · ${a.qty}주 · 평단 <b class="num">${usd(a.avg)}</b> · 잔금 <b class="num">${usd(a.cash)}</b>`;
};
window.submitHist = del => {
  const session = val('hsDate'), rows = del ? [] : histRows(), T = +val('hsT');
  if (!session) return toast('날짜를 고르세요');
  if (hist.c.pending && hist.c.plan && hist.c.plan.session === session) return toast('체결 확인 전인 날은 다음날 아침 이후에 고쳐 주세요');
  if (!del && !rows.length && !(hist.old || []).length) return toast('가격과 수량을 입력하세요');
  const a = ledgerAfter(hist.c, hist.old || [], rows);
  if (a.bad) return toast('보유수량이 음수가 돼요');
  if (isNaN(T) || T < 0 || T > hist.c.splits) return toast(`T 는 0~${hist.c.splits}`);
  const msg = del || !rows.length ? `${session} 기록을 지우고 장부를 되돌릴까요?` : `${session} 기록 ${rows.length}건으로 저장할까요?`;
  if (confirm(`${msg}\n저장 후: T${T} · ${a.qty}주 · 평단 ${usd(a.avg)} · 잔금 ${usd(a.cash)}`))
    control('history_edit', { id: hist.id, session, fills: rows, T });
};

window.openHistory = () => openSheet(`<h3>과거 완료 기록 추가</h3>
  <label class="f"><span>이름</span><input id="hName" placeholder="예: SOXL 1차"></label>
  <div class="f2"><label class="f"><span>증권사</span><select id="hBroker"><option value="DB">DB</option><option value="KIWOOM">키움</option></select></label><label class="f"><span>종목</span><input id="hTicker" value="SOXL"></label></div>
  <div class="f2"><label class="f"><span>시작일</span><input id="hStart" type="date"></label><label class="f"><span>종료일</span><input id="hEnd" type="date"></label></div>
  <div class="f2"><label class="f"><span>원금</span><input id="hPrin" inputmode="decimal"></label><label class="f"><span>수익금 (손실은 −)</span><input id="hProfit" inputmode="decimal"></label></div>
  <div class="f2"><label class="f"><span>분할 (선택)</span><input id="hSplits" inputmode="numeric"></label><label class="f"><span>수수료 $ (선택)</span><input id="hFees" inputmode="decimal"></label></div>
  <div class="help" style="margin-bottom:10px">수익금은 수수료를 뺀 금액으로 입력하세요.</div>
  <button class="btn primary" style="width:100%" onclick="submitHistory()">추가</button>`);
window.submitHistory = () => {
  const p = { name: val('hName'), broker: val('hBroker'), ticker: val('hTicker').toUpperCase(), started: val('hStart'), ended: val('hEnd'), principal: +val('hPrin'), profit: +val('hProfit'), splits: val('hSplits'), fees: +val('hFees') || 0 };
  if (!p.started || !p.ended || !(p.principal > 0) || isNaN(p.profit)) return toast('날짜·원금·수익금을 입력하세요');
  control('history', p);
};

render(); load();
</script>
</body>
</html>

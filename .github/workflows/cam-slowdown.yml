name: cam-slowdown APK

on:
  push:
    paths:
      - "cam-slowdown/**"
      - ".github/workflows/cam-slowdown.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cam-slowdown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk cam-slowdown.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cam-slowdown-apk
          path: cam-slowdown/cam-slowdown.apk
      - name: Publish to release (phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cam-slowdown-latest
          name: 카메라 감속 앱 (최신 빌드)
          prerelease: true
          files: cam-slowdown/cam-slowdown.apk
          body: "브랜치 ${{ github.ref_name }} / 커밋 ${{ github.sha }} 빌드. 폰에서 cam-slowdown.apk를 받아 설치하세요."
